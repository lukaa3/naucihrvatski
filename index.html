let CH = { busy:false };
// CH.hist stays a live pointer into the current saved conversation,
// so every existing call site keeps working unchanged.
Object.defineProperty(CH, "hist", {
  get(){ return curChat().hist; },
  set(v){ curChat().hist = v; save(); }
});

function newChat(scenario, level){
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  S.chats = S.chats || {};
  S.chats[id] = { id, title:"", scenario: scenario || S.scenario, level: level || S.level,
                  created: Date.now(), updated: Date.now(), hist: [] };
  S.chatId = id;
  return S.chats[id];
}
function curChat(){
  S.chats = S.chats || {};
  if(!S.chatId || !S.chats[S.chatId]) newChat();
  return S.chats[S.chatId];
}
function touchChat(){
  const c = curChat();
  c.updated = Date.now();
  if(!c.title){
    const first = c.hist.find(m => m.who === "me");
    const sc = SCENARIOS.find(x => x.k === c.scenario);
    c.title = first ? first.hr.slice(0,42) : (sc ? sc.l : "Razgovor");
  }
  save();
}
function openChat(id){
  if(!S.chats[id]) return;
  S.chatId = id;
  S.scenario = S.chats[id].scenario;
  S.level = S.chats[id].level || S.level;
  save(); vTalk();
}
function startChat(){
  const c = curChat();
  if(c.hist.length) newChat(S.scenario, S.level);
  save(); vTalk();
}
let DELARM = null;
function delChat(id, ev){
  ev.stopPropagation();
  if(DELARM !== id){ DELARM = id; vTalk(); setTimeout(()=>{ if(DELARM===id){ DELARM=null; if(CUR==="razgovor") vTalk(); } }, 3500); return; }
  DELARM = null;
  delete S.chats[id];
  if(S.chatId === id){ S.chatId = Object.keys(S.chats)[0] || null; if(!S.chatId) newChat(); }
  save(); vTalk();
}
function renameChat(id, ev){
  ev.stopPropagation();
  const c = S.chats[id]; if(!c) return;
  const v = prompt("Novi naziv razgovora:", c.title || "");
  if(v !== null){ c.title = v.trim().slice(0,60) || c.title; save(); vTalk(); }
}
function ago(t){
  const d = Math.floor((Date.now()-t)/1000);
  if(d < 60) return "sada";
  if(d < 3600) return Math.floor(d/60) + " min";
  if(d < 86400) return Math.floor(d/3600) + " h";
  const days = Math.floor(d/86400);
  return days === 1 ? "jučer" : days + " dana";
}
const LEVELS = [
  {k:"A1", l:"Početnik", en:"beginner", d:"very short sentences, present tense, common words, lots of scaffolding"},
  {k:"A2", l:"Osnovni",  en:"elementary", d:"short everyday sentences, past and future allowed, basic cases"},
  {k:"B1", l:"Srednji",  en:"intermediate", d:"normal conversational Croatian, full case system, some idiom"}
];

function vTalk(){
  const cur = curChat();
  const list = Object.values(S.chats||{}).sort((a,b)=>(b.updated||b.created)-(a.updated||a.created));
  const sc = SCENARIOS.find(x=>x.k===S.scenario) || SCENARIOS[0];
  shell("razgovor · conversation", "Pričaj sa <i>mnom</i>",
    "Pick a situation and type back in Croatian. Every reply comes with a translation you can ignore once you don't need it, a gentle correction when you slip, and three things you could say next.",
    `<div class="card">
      <div class="kicker">situacija</div>
      <div class="chips" style="margin-bottom:14px">${SCENARIOS.map(s=>
        `<button class="chip" aria-pressed="${s.k===S.scenario}" onclick="setScenario('${s.k}')">${s.l}</button>`).join("")}</div>
      <div class="kicker">razina · level</div>
      <div class="chips">${LEVELS.map(l=>
        `<button class="chip" aria-pressed="${l.k===S.level}" onclick="setLevel('${l.k}')">${l.k} · ${l.l}</button>`).join("")}
        <button class="chip" aria-pressed="${S.showEn}" onclick="S.showEn=!S.showEn;save();vTalk()">Prijevod</button></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <div class="kicker" style="margin:0">razgovori · ${list.length} spremljeno</div>
        <button class="btn sm" onclick="startChat()">+ Novi razgovor</button>
      </div>
      ${list.length ? `<div class="chatlist">${list.map(c=>{
        const sc = SCENARIOS.find(x=>x.k===c.scenario);
        const last = c.hist[c.hist.length-1];
        const on = c.id === S.chatId;
        return `<div class="chatrow${on?" on":""}" onclick="openChat('${c.id}')">
          <div class="cmeta">
            <div class="ct">${esc(c.title || (sc?sc.l:"Razgovor"))}</div>
            <div class="cs2">${esc(sc?sc.l:"")} · ${esc(c.level||"A1")} · ${c.hist.length} poruka · ${ago(c.updated||c.created)}</div>
            ${last ? `<div class="cprev">${esc(String(last.hr||"").slice(0,70))}</div>` : ""}
          </div>
          <button class="crn" title="Preimenuj" onclick="renameChat('${c.id}',event)">✎</button>
          <button class="cdel${DELARM===c.id?" armed":""}" onclick="delChat('${c.id}',event)">${DELARM===c.id?"Obriši?":"×"}</button>
        </div>`;
      }).join("")}</div>` : `<p style="font-size:14px;color:var(--stone-dim);margin:0">Nema spremljenih razgovora. Napiši nešto ispod i razgovor se sprema sam.</p>`}
    </div>

    <div class="card" style="margin-top:14px">
      <div class="kicker">${esc(sc.l)} · ${esc(sc.en)}</div>
      <div class="chat" id="chat"></div>
      <div id="sugg" class="hintbar"></div>
      <div class="composer">
        <input id="say" placeholder="Napiši nešto na hrvatskom…" autocomplete="off" autocapitalize="sentences">
        <button class="btn" id="send" onclick="sendMsg()">Pošalji</button>
      </div>
      <div style="font-size:12.5px;color:var(--stone-dim);margin-top:9px">Stuck? Write <b style="color:var(--brass)">?</b> and press send — I'll rephrase in easier Croatian and tell you what to say.</div>
      <div id="cherr"></div>
    </div>`);
  paintChat();
  if(!CH.hist.length) openLine();
  const i = $("#say"); if(i){ i.focus(); i.addEventListener("keydown", e=>{ if(e.key==="Enter") sendMsg(); }); }
}
function setScenario(k){
  const c = curChat();
  S.scenario = k;
  if(c.hist.length) newChat(k, S.level); else { c.scenario = k; }
  save(); vTalk();
}
function setLevel(k){ S.level = k; curChat().level = k; save(); vTalk(); }

function paintChat(){
  const c = $("#chat"); if(!c) return;
  c.innerHTML = CH.hist.map(m=>{
    if(m.who==="me") return `<div class="msg me"><div class="cro">${esc(m.hr)}</div></div>`;
    return `<div class="msg bot"><div class="cro">${esc(m.hr)} ${spk(m.hr)}</div>
      ${S.showEn && m.tr ? `<div class="tr">${esc(m.tr)}</div>` : ""}
      ${m.fix ? `<div class="fix"><b>Skoro:</b> ${esc(m.fix.fixed)}<br><span style="color:var(--stone-dim)">${esc(m.fix.note)}</span></div>` : ""}</div>`;
  }).join("");
  c.scrollTop = c.scrollHeight;
  const s = $("#sugg");
  const last = CH.hist[CH.hist.length-1];
  if(s) s.innerHTML = (last && last.sugg ? last.sugg : []).map(x=>
    `<button onclick="useSugg(${JSON.stringify(x).replace(/"/g,'&quot;')})">${esc(x)}</button>`).join("");
}
function useSugg(t){ const i=$("#say"); i.value=t; i.focus(); }

function tutorSystem(){
  const sc = SCENARIOS.find(x=>x.k===S.scenario) || SCENARIOS[0];
  const lv = LEVELS.find(x=>x.k===S.level) || LEVELS[0];
  return STYLE_RULES + `
ROLE: ${sc.s}
The learner is a teenage English speaker at CEFR ${lv.k} (${lv.en}). Match that: ${lv.d}.

HOW TO BEHAVE:
- Speak ONLY Croatian in the "reply" field. Keep it to 1-2 sentences and always end with a question so the conversation continues.
- Stay in character. Be warm, curious and a bit funny. React to what they actually said.
- If the learner writes "?" or asks in English, rephrase your previous question more simply in Croatian and put the explanation in "note".
- Correct only meaningful errors (wrong case, wrong verb form, wrong word choice, non-Croatian words). Ignore missing diacritics and capitalisation — a learner typing on a US keyboard cannot easily type č ž š ć đ.
- If they wrote a Serbian/Bosnian form (kafa, hleb, voz, šta, ko, hiljada, ekavian), always correct it and say briefly what the Croatian word is.
- If their Croatian was fine, set "correction" to null and do not invent a nitpick.
- "suggestions" = three short, natural things THEY could say next, in Croatian at their level.

OUTPUT: return ONLY valid JSON, no markdown fences, no text outside it:
{"reply":"<Croatian>","translation":"<English of reply>","correction":null or {"fixed":"<their sentence corrected>","note":"<one short English sentence explaining why>"},"suggestions":["...","...","..."]}`;
}

async function openLine(){
  if(CH.busy) return; CH.busy = true;
  try{
    const txt = await ask(tutorSystem(), [{role:"user", content:"Start the conversation. Greet me in character and ask me one easy opening question."}]);
    const j = parseJSON(txt);
    CH.hist.push({who:"bot", hr:j.reply, tr:j.translation, sugg:j.suggestions||[]});
    touchChat(); paintChat();
  }catch(e){ if($("#cherr")) $("#cherr").innerHTML = apiError(e); }
  CH.busy = false;
}

async function sendMsg(){
  const i = $("#say"); if(!i) return;
  const t = i.value.trim(); if(!t || CH.busy) return;
  i.value = ""; CH.busy = true; $("#send").disabled = true;
  CH.hist.push({who:"me", hr:t}); touchChat(); paintChat();
  const c = $("#chat");
  c.insertAdjacentHTML("beforeend", `<div class="msg bot" id="typing"><span class="spin"></span></div>`);
  c.scrollTop = c.scrollHeight;
  try{
    const msgs = [];
    CH.hist.forEach(m=>{
      if(m.who==="me") msgs.push({role:"user", content:m.hr});
      else msgs.push({role:"assistant", content:JSON.stringify({reply:m.hr, translation:m.tr, correction:m.fix||null, suggestions:m.sugg||[]})});
    });
    const txt = await ask(tutorSystem(), msgs);
    const j = parseJSON(txt);
    CH.hist.push({who:"bot", hr:j.reply, tr:j.translation, fix:j.correction||null, sugg:j.suggestions||[]});
    touchChat(); addXP(3);
  }catch(e){
    CH.hist.push({who:"bot", hr:"Oprosti, nešto nije u redu.", tr:"Sorry — the connection failed. Details below.", sugg:[]});
    if($("#cherr")) $("#cherr").innerHTML = apiError(e);
    console.error("Pleter AI call failed:", e);
  }
  const ty = $("#typing"); if(ty) ty.remove();
  CH.busy = false; if($("#send")) $("#send").disabled = false;
  paintChat(); if($("#say")) $("#say").focus();
}

async function genRead(topic){
  const out = $("#rout");
  out.innerHTML = `<div class="card" style="margin-top:14px"><span class="spin"></span> Pišem tekst o temi „${esc(topic)}"…</div>`;
  try{
    const txt = await ask(STYLE_RULES + "You write graded reading texts for a Croatian course.",
      [{role:"user", content:`Topic: ${topic}. Level: CEFR ${S.level}.
Write a short original text in standard Croatian: ${S.level==="A1"?"60-90":S.level==="A2"?"110-150":"170-220"} words. Natural, warm, specific, with real Croatian detail. Present tense dominant at A1.
Then: a glossary of the 10-14 hardest words (give the DICTIONARY form plus the English), and 4 comprehension questions in Croatian with 4 options each.
Return ONLY this JSON, no markdown:
{"title":"<Croatian title>","text":"<the text>","translation":"<full English translation>","glossary":[["<dictionary form>","<English>"]],"questions":[{"q":"<question in Croatian>","o":["","","",""],"a":<index>,"e":"<short English explanation>"}]}`}], 2000);
    RD = parseJSON(txt); RD.topic = topic; GLOSSCACHE = {};

}

function markup(t){
  const re = /[A-Za-zČčĆćŠšŽžĐđ]{2,}/g;
  let out = "", last = 0, m;
  while((m = re.exec(t))){
    out += esc(t.slice(last, m.index));
    out += '<w onclick="gloss(event,&quot;'+esc(m[0])+'&quot;)">'+esc(m[0])+'</w>';
    last = m.index + m[0].length;
  }
  return out + esc(t.slice(last));
}
function paintRead(){
  const out = $("#rout"); if(!out || !RD) return;
  const body = String(RD.text||"").split(/\n+/).map(p=>"<p>"+markup(p)+"</p>").join("");
  out.innerHTML = `<div class="card" style="margin-top:14px">

      <div class="wordlist">${RD.glossary.map(g=>wordRow(g[0],g[1])).join("")}</div>`:""}`;
}
function readQuiz(){
  if(!RD || !RD.questions) return;
  D = {unit:null, title:RD.title||"Pitanja", q:RD.questions.map(q=>({t:"mc",q:q.q,o:q.o,a:q.a,e:q.e})), i:0, score:0};
  paintDrill();

async function gloss(ev, word){
  const g = $("#gloss");
  const key = norm(word);
  const put = txt=>{
    g.innerHTML = `<b>${esc(word)}</b>${txt}`;
    g.classList.remove("hidden");
    const r = ev.target.getBoundingClientRect();
    g.style.left = Math.min(window.innerWidth-260, Math.max(8, r.left)) + "px";
    g.style.top  = (r.bottom + 8) + "px";
    clearTimeout(g._t); g._t = setTimeout(()=>g.classList.add("hidden"), 4500);
  };
  let hit = GLOSSCACHE[key];
  if(!hit){ const k = Object.keys(GLOSSCACHE).find(x => key.startsWith(x.slice(0, Math.max(3, x.length-2)))); if(k) hit = GLOSSCACHE[k]; }
  if(hit) return put(esc(hit));
  put(`<span class="spin"></span>`);
  try{
    const txt = await ask(STYLE_RULES + "You are a Croatian dictionary. Be terse.",
      [{role:"user", content:`The word "${word}" appears in this Croatian text: "${String(RD&&RD.text||"").slice(0,400)}".
Reply with ONLY this, one line, no JSON, no extra words:
<dictionary form> — <English meaning> (<grammatical note, e.g. genitiv jednine, 1. lice prezenta>)`}], 200);
    GLOSSCACHE[key] = txt;
    put(esc(txt));
  }catch(e){ put(" — nije dostupno"); }
}
document.addEventListener("scroll", ()=>{ const g=$("#gloss"); if(g) g.classList.add("hidden"); }, true);

function seedCards(){

  if(FC.i >= FC.q.length){

  }

  const back  = FC.dir==="hr" ? p[1] : p[0];
  shell(`kartica ${FC.i+1} od ${FC.q.length} · kutija ${S.cards[k].box||1}`, "Kartice", "",
    `<div class="progressline"><i style="width:${FC.i/FC.q.length*100}%"></i></div>
    <div class="flash">
      <div class="front">${esc(front)}</div>
      ${FC.dir==="hr"?spk(p[0]):""}
      <div class="back" id="bk">${FC.flipped?esc(back):'<span style="opacity:.4">· · ·</span>'}</div>
    </div>
    <div style="margin-top:16px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      ${FC.flipped
        ? `<button class="btn ghost" onclick="gradeCard(false)">Ne znam</button><button class="btn" onclick="gradeCard(true)">Znam</button>`
        : `<button class="btn brass" onclick="FC.flipped=true;paintCard()">Okreni</button>`}

function gradeCard(ok){
  const k = FC.q[FC.i], c = S.cards[k];
  c.seen = (c.seen||0)+1;
  c.box = ok ? Math.min(5,(c.box||1)+1) : 1;
  if(ok){ FC.right++; addXP(2); } else save();
  FC.i++; FC.flipped = false; paintCard();
}

      <div class="note">Croatian uses <b>Latin script only</b>. Dž, Lj and Nj are single letters, not pairs. There are no silent letters and no exceptions: spell it as you hear it, read it as it's written.</div>

        ${CROATIAN_ONLY.map(r=>`<tr><td class="hr" style="color:var(--olive)">${esc(r[0])}</td><td style="color:var(--madder);opacity:.8">${esc(r[1])}</td><td style="color:var(--stone-dim);font-size:13.5px">${esc(r[2])}</td></tr>`).join("")}

    <div class="card" style="margin-top:14px">

      <p style="font-size:15px">The little unstressed words — <b>sam, si, je, smo, ste, su · ću, ćeš, će · bih, bi · me, te, ga, joj, mu, se · li</b> — cluster in <b>second position</b> in the clause, and they go in this order:</p>
      <p style="font-family:var(--display);font-size:19px;color:var(--brass)">li → ću/bih → mi/ti/mu/joj → me/te/ga/je → se → je (biti)</p>

    </div>`);

   ============================================================ */
const CLOUD = {
  ready:false, user:null, email:"", busy:false,
  lastSync:0, lastErr:"", available:false,

  init(){
    if(typeof netlifyIdentity === "undefined"){ this.ready = true; return; }
    this.available = true;
    try{
      netlifyIdentity.on("init", u => { this.user = u; this.email = u ? u.email : ""; this.ready = true;
        paintCloud(); if(u) this.sync(); });
      netlifyIdentity.on("login", u => { this.user = u; this.email = u.email; netlifyIdentity.close();
        paintCloud(); this.sync(); });
      netlifyIdentity.on("logout", () => { this.user = null; this.email = ""; paintCloud();
        if(CUR === "napredak") vSave(); });
      netlifyIdentity.init();
    }catch(e){ this.ready = true; this.available = false; }
  },

  open(tab){
    if(!this.available){ this.lastErr = "WIDGET"; paintCloud(); return; }
    netlifyIdentity.open(tab || "login");
  },
  out(){ if(this.available) netlifyIdentity.logout(); },

  async token(){
    if(!this.user) return null;
    try{ return await this.user.jwt(); }catch(e){ return null; }
  },

  async call(method, body){
    const t = await this.token();
    if(!t) throw new Error("NOT_SIGNED_IN");
    const res = await fetch("/.netlify/functions/sync", {
      method,
      headers: { "Authorization": "Bearer " + t, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    if(res.status === 404) throw new Error("NO_FUNCTION");
    let d = null;
    try{ d = await res.json(); }catch(e){ throw new Error("BAD_RESPONSE"); }
    if(!res.ok) throw new Error(d.error || ("HTTP " + res.status));
    return d;
  },

  // On sign-in: whichever copy is newer wins, and the other gets overwritten.
  async sync(){
    if(this.busy) return; this.busy = true; this.lastErr = "";
    try{
      const d = await this.call("GET");
      if(d.empty){ await this.push(); }
      else if((d.updatedAt || 0) > (S.updatedAt || 0)){
        applyState(d.state); await Store.set("pleter:state", S);
        this.lastSync = d.updatedAt; paintStats();
        if(CUR === "napredak") vSave();
      }else{
        await this.push();
      }
    }catch(e){ this.lastErr = String(e.message || e); }
    this.busy = false; paintCloud();
    if(CUR === "napredak" && !this.lastErr) vSave();
  },

  async push(quiet){
    if(!this.user) return;
    try{
      const d = await this.call("POST", { state: S, v: VERSION });
      this.lastSync = d.updatedAt; this.lastErr = "";
    }catch(e){ this.lastErr = String(e.message || e); }
    paintCloud();
    if(!quiet && CUR === "napredak") vSave();
  },

  async pull(){
    try{
      const d = await this.call("GET");
      if(d.empty){ this.lastErr = "EMPTY"; }
      else { applyState(d.state); await Store.set("pleter:state", S);
             this.lastSync = d.updatedAt; this.lastErr = ""; paintStats(); }
    }catch(e){ this.lastErr = String(e.message || e); }
    if(CUR === "napredak") vSave();
  }
};

function cloudErrText(m){
  if(m === "NOT_SIGNED_IN")      return "Sign in again — your session expired.";
  if(m === "NO_FUNCTION")        return "sync.js isn't deployed yet.";
  if(m === "STORAGE_UNAVAILABLE")return "Netlify Blobs isn't available on this site.";
  if(m === "TOO_LARGE")          return "Your save is over 900 KB. Delete some old conversations.";
  if(m === "EMPTY")              return "Nothing saved in the cloud yet.";
  if(m === "WIDGET")             return "Identity isn't enabled on this site yet.";
  return m;
}

function paintCloud(){
  const el = $("#cloudbadge"); if(!el) return;
  el.textContent = CLOUD.user ? ("☁ " + CLOUD.email.split("@")[0]) : "";

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64.trim());
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const TAG = "PLETER1:";
let INCL_CHATS = false;
function exportObj(withChats){
  const o = JSON.parse(JSON.stringify(S));
  if(!withChats){ delete o.chats; delete o.chatId; }
  o._v = VERSION;
  return o;
}
function saveCode(){ return TAG + b64enc(JSON.stringify(exportObj(INCL_CHATS))); }

function downloadSave(){
  try{
    const blob = new Blob([JSON.stringify(exportObj(true), null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "pleter-save-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){
    $("#rmsg").innerHTML = `<div class="err">Download blocked here. Use the save code instead, or open the site in a normal browser tab.</div>`;
  }
}

function uploadSave(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    const m = $("#rmsg");
    try{
      const obj = JSON.parse(r.result);
      if(typeof obj !== "object" || obj === null) throw new Error("shape");
      applyState(obj);

      setTimeout(()=>go("napredak"), 1100);
    }catch(e){ m.innerHTML = `<div class="err">That file isn't a Pleter backup.</div>`; }
  };
  r.readAsText(f);
}

function applyState(obj){
  const base = {name:"", xp:0, streak:0, lastDay:null, done:{}, cards:{}, chats:{}, chatId:null,
                level:"A1", scenario:"kafic", showEn:true};
  const keepChats = obj.chats ? obj.chats : S.chats;      // a progress-only code shouldn't wipe your conversations
  const keepId    = obj.chats ? obj.chatId : S.chatId;

}

async function copyCode(){
  const b = $("#cpy"), t = $("#code");
  try{ await navigator.clipboard.writeText(t.value); b.textContent = "Kopirano ✓"; }
  catch(e){ t.focus(); t.select(); b.textContent = "Označeno — pritisni Ctrl/Cmd + C"; }
  setTimeout(()=>{ if($("#cpy")) $("#cpy").textContent = "Kopiraj kod"; }, 2600);
}

async function restoreCode(){
  const v = ($("#restore").value||"").trim();
  const m = $("#rmsg");
  if(!v){ m.innerHTML = `<div class="err">Paste a save code first.</div>`; return; }
  if(v.indexOf(TAG) !== 0){ m.innerHTML = `<div class="err">That doesn't look like a Pleter code — it should start with ${TAG}</div>`; return; }
  try{
    const obj = JSON.parse(b64dec(v.slice(TAG.length)));
    if(typeof obj !== "object" || obj === null) throw new Error("shape");
    applyState(obj);
    await save();
    m.innerHTML = `<div class="verdict ok"><b style="color:var(--olive)">Vraćeno.</b> ${S.xp||0} bodova · ${Object.keys(S.cards||{}).length} kartica${obj.chats?" · "+Object.keys(S.chats||{}).length+" razgovora":""}.</div>`;
    setTimeout(()=>go("napredak"), 1100);
  }catch(e){ m.innerHTML = `<div class="err">Couldn't read that code. It may have been cut off when copying — make sure you got the whole thing, with no line breaks added.</div>`; }
}

    <p style="color:var(--stone-dim);font-size:14px;margin:0">${
      st.k === "server" ? "Requests go to this site's own function, which holds the key server-side. Nothing to paste."
      : st.k === "key"  ? "A personal key is set in this browser, so it's used instead of the server. Clear it below to test the server path."
      : st.k === "claude" ? "Running inside Claude, so the tutor works through Claude and no key is needed."
      : st.k === "probing" ? "Checking the server…"
      : "The server path isn't usable yet. The checks below say why."}</p>
    ${diag}

    <div style="margin-top:16px"><button class="btn" onclick="testConn()">Provjeri vezu</button></div>
    <div id="kmsg" style="margin-top:12px"></div>

    <hr class="rule">
    <details ${GKEY?"open":""}>
      <summary style="cursor:pointer;font-size:13.5px;color:var(--stone-dim)">Napredno — vlastiti Gemini ključ</summary>
      <p style="font-size:13px;color:var(--stone-dim);margin-top:10px">Only needed if you're running the file locally with no server behind it. On the live site, leave this empty.</p>
      <input class="field" id="k" type="password" autocomplete="off" spellcheck="false"
             placeholder="${GKEY ? maskKey(GKEY) : "AIza…"}" value="">
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--stone-dim);margin-top:8px">
        <input type="checkbox" onchange="$('#k').type = this.checked ? 'text' : 'password'"> Prikaži ključ
      </label>
      <div class="kicker" style="margin-top:14px">model</div>
      <select class="field" id="m">${MODELS.map(m=>`<option value="${m}" ${m===GMODEL?"selected":""}>${m}</option>`).join("")}</select>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn ghost" onclick="saveKey()">Spremi ključ</button>
        ${GKEY ? `<button class="btn ghost" onclick="clearKey()">Obriši ključ</button>` : ""}
      </div>
      <p style="font-size:12.5px;color:var(--stone-dim);margin-top:12px;margin-bottom:0">A personal key is stored in this browser only and is deliberately excluded from your save codes and backups. If a key of yours has ever been pasted somewhere public, delete it in AI Studio and make a new one.</p>
    </details>

    <div style="margin-top:18px"><button class="btn ghost" onclick="closeSettings()">Zatvori</button></div>
  </div>`;
  document.addEventListener("keydown", escClose);
}

async function testConn(){
  const msg = $("#kmsg");
  msg.innerHTML = `<div style="font-size:14px"><span class="spin"></span> Provjeravam…</div>`;
  try{
    const out = await ask("Odgovaraj isključivo na standardnom hrvatskom jeziku.",
      [{role:"user", content:"Pozdravi me u jednoj kratkoj rečenici."}], 256);
    const via = GKEY ? "osobni ključ" : PROXY_OK ? "poslužitelj" : "Claude";
    msg.innerHTML = `<div class="verdict ok"><b style="color:var(--olive)">Radi</b> — preko: ${via}.<br>„${esc(out.slice(0,140))}"</div>`;
    paintGear();
  }catch(e){ msg.innerHTML = apiError(e); }
}

function escClose(e){ if(e.key === "Escape") closeSettings(); }
function closeSettings(){
  const box = $("#settings");
  box.className = "hidden"; box.innerHTML = "";
  document.removeEventListener("keydown", escClose);
}

async function saveKey(){
  const v = ($("#k").value || "").trim();
  const m = $("#m").value;
  GMODEL = m; await Store.set(MODEL_K, m);
  if(v){ GKEY = v; await Store.set(KEY_K, v); }
  paintGear();
  $("#kmsg").innerHTML = `<div class="verdict ok"><b style="color:var(--olive)">Spremljeno.</b> ${GKEY ? "Ključ "+esc(maskKey(GKEY))+" · model "+esc(GMODEL) : "Model "+esc(GMODEL)+". Ključ nije unesen."}</div>`;
}

async function clearKey(){
  GKEY = ""; PROXY_OK = null; await Store.del(KEY_K); paintGear();
  $("#kmsg").innerHTML = `<div class="verdict no">Ključ obrisan s ovog uređaja.</div>`;
  setTimeout(openSettings, 900);
}

async function testKey(){
  const msg = $("#kmsg");
  const k = ($("#k").value || "").trim() || GKEY;
  const m = $("#m").value;
  if(!k){ msg.innerHTML = `<div class="err">Paste a key first.</div>`; return; }
  msg.innerHTML = `<div style="font-size:14px"><span class="spin"></span> Zovem Gemini…</div>`;
  try{
    const out = await askGemini("Odgovaraj isključivo na standardnom hrvatskom jeziku.",
      [{role:"user", content:"Pozdravi me u jednoj kratkoj rečenici."}], 256, k, m);
    msg.innerHTML = `<div class="verdict ok"><b style="color:var(--olive)">Radi.</b> ${esc(m)} kaže: „${esc(out.slice(0,120))}"</div>`;
  }catch(e){
    msg.innerHTML = apiError(e);
  }
}

/* ============================================================
   INIT
   ============================================================ */
(async function(){
  await loadKey();
  if(!GKEY) probe();          // non-blocking; paints the indicator when it lands
  await loadState();
  paintNav();
  paintStats();
  paintGear();
  go("home");
  CLOUD.init();
})();
</script>

</body>
</html>
