<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleter — učim hrvatski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700&family=Karla:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
:root{
  --deep:#0F212B;
  --deep-2:#16303C;
  --deep-3:#1E3F4D;
  --stone:#EDE7DA;
  --stone-dim:#A9B4B6;
  --olive:#93AC72;
  --madder:#CB4B3C;
  --brass:#D9A441;
  --line:rgba(237,231,218,.12);
  --line-2:rgba(237,231,218,.22);
  --display:'Alegreya', Georgia, 'Times New Roman', serif;
  --body:'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'Space Mono', ui-monospace, Menlo, monospace;
  --r:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--deep);
  color:var(--stone);
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 82% -8%, rgba(217,164,65,.09), transparent 60%),
    radial-gradient(700px 600px at 6% 104%, rgba(147,172,114,.07), transparent 62%);
}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:var(--brass)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;max-width:1240px;margin:0 auto}

.rail{
  border-right:1px solid var(--line);
  padding:26px 18px 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:22px;
}
.brand{display:block;text-decoration:none;color:inherit}
.brand .mark{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.brand .mark em{font-style:italic;color:var(--brass)}
.brand .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone-dim);margin-top:2px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-radius:10px;padding:9px 11px;
  color:var(--stone-dim);transition:background .15s,color .15s;
}
.nav button .hr{font-family:var(--display);font-size:17px;font-weight:700;color:inherit}
.nav button .en{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.nav button:hover{background:rgba(237,231,218,.05);color:var(--stone)}
.nav button[aria-current="true"]{background:var(--deep-2);color:var(--stone)}
.nav button[aria-current="true"] .hr{color:var(--brass)}

.rail-foot{margin-top:auto;font-size:12px;color:var(--stone-dim);line-height:1.5}
.stat-row{display:flex;gap:14px;margin-bottom:12px}
.stat{flex:1}
.stat b{display:block;font-family:var(--mono);font-size:19px;color:var(--brass);font-weight:700}
.stat span{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--stone-dim)}

.main{padding:30px 34px 90px;min-width:0}

/* ---------- pleter (signature) ---------- */
.pleter{width:100%;height:26px;display:block;overflow:visible}
.pleter .bg{stroke:rgba(237,231,218,.14)}
.pleter .fg{stroke:var(--brass)}
.pleter path{fill:none;stroke-width:2.2;stroke-linecap:round}

/* ---------- page head ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.page-h{font-size:clamp(30px,4.4vw,44px);margin-bottom:6px}
.page-h i{color:var(--brass);font-style:italic}
.lede{color:var(--stone-dim);max-width:60ch;margin-bottom:24px}

/* ---------- cards ---------- */
.card{background:var(--deep-2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone-dim);margin-bottom:10px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--madder);border:1px solid var(--madder);color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;
  transition:transform .12s, filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--stone)}
.btn.ghost:hover{background:rgba(237,231,218,.06)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#20180A}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:transparent;border:1px solid var(--line-2);color:var(--stone-dim);
  padding:5px 12px;border-radius:999px;font-size:13.5px;transition:.15s;
}
.chip:hover{color:var(--stone);border-color:var(--stone-dim)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#20180A;font-weight:600}

/* ---------- word rows ---------- */
.wordlist{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.word{display:flex;align-items:center;gap:12px;background:var(--deep-2);padding:9px 13px}
.word .hr{font-family:var(--display);font-size:19px;font-weight:700;min-width:150px}
.word .en{color:var(--stone-dim);flex:1;font-size:14.5px}
.word .note{font-size:12px;color:var(--brass);opacity:.85;font-style:italic}
.spk{background:none;border:0;color:var(--stone-dim);padding:3px 5px;border-radius:6px;line-height:1}
.spk:hover{color:var(--brass);background:rgba(217,164,65,.1)}
.save{background:none;border:0;color:var(--stone-dim);padding:3px 5px;font-size:13px}
.save:hover{color:var(--brass)}
.save[aria-pressed="true"]{color:var(--brass)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone-dim);font-weight:600}
td.hr{font-family:var(--display);font-size:17px;font-weight:600}
td.cs{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.tblwrap{overflow-x:auto}

/* ---------- unit list ---------- */
.unit{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--deep-2);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;margin-bottom:9px;transition:.15s;
}
.unit:hover{border-color:var(--line-2);transform:translateX(3px)}
.unit .ord{
  font-family:var(--display);font-style:italic;font-size:14px;color:var(--brass);
  min-width:62px;border-right:1px solid var(--line);padding-right:12px;line-height:1.2;
}
.unit .ord b{display:block;font-style:normal;font-family:var(--mono);font-size:20px;font-weight:700}
.unit .body{flex:1;min-width:0}
.unit .t{font-family:var(--display);font-size:21px;font-weight:700}
.unit .s{font-size:13px;color:var(--stone-dim)}
.unit .tick{color:var(--olive);font-size:19px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:56vh;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:12px 15px;border-radius:14px;font-size:15.5px}
.msg.bot{background:var(--deep-3);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:rgba(203,75,60,.16);border:1px solid rgba(203,75,60,.4);align-self:flex-end;border-bottom-right-radius:4px}
.msg .cro{font-family:var(--display);font-size:18px;line-height:1.45}
.msg .tr{font-size:13.5px;color:var(--stone-dim);margin-top:5px;font-style:italic}
.fix{margin-top:9px;padding:9px 11px;border-left:3px solid var(--olive);background:rgba(147,172,114,.1);border-radius:0 8px 8px 0;font-size:13.5px}
.fix b{color:var(--olive)}
.composer{display:flex;gap:9px;margin-top:14px}
.composer input{
  flex:1;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 15px;border-radius:999px;font-size:16px;
}
.composer input::placeholder{color:var(--stone-dim);opacity:.65}
.hintbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hintbar button{background:rgba(217,164,65,.11);border:1px solid rgba(217,164,65,.3);color:var(--brass);padding:4px 11px;border-radius:999px;font-size:13px}
.hintbar button:hover{background:rgba(217,164,65,.2)}

/* ---------- quiz ---------- */
.q{font-family:var(--display);font-size:23px;font-weight:700;margin-bottom:14px;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 16px;border-radius:11px;font-size:16px;transition:.13s;
}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.right{border-color:var(--olive);background:rgba(147,172,114,.16)}
.opt.wrong{border-color:var(--madder);background:rgba(203,75,60,.14)}
.answer{
  width:100%;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 16px;border-radius:11px;font-size:18px;font-family:var(--display);
}
.verdict{margin-top:13px;padding:12px 14px;border-radius:10px;font-size:14.5px}
.verdict.ok{background:rgba(147,172,114,.13);border:1px solid rgba(147,172,114,.4)}
.verdict.no{background:rgba(203,75,60,.12);border:1px solid rgba(203,75,60,.4)}
.progressline{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.progressline i{display:block;height:100%;background:var(--brass);transition:width .3s}

/* ---------- reading ---------- */
.read{font-family:var(--display);font-size:20px;line-height:1.75;max-width:62ch}
.read w{cursor:pointer;border-bottom:1px dotted rgba(217,164,65,.4)}
.read w:hover{color:var(--brass);background:rgba(217,164,65,.09)}
.gloss{
  position:fixed;background:var(--deep-3);border:1px solid var(--brass);border-radius:9px;
  padding:8px 12px;font-family:var(--body);font-size:14px;z-index:60;pointer-events:none;
  box-shadow:0 8px 26px rgba(0,0,0,.5);max-width:250px;
}
.gloss b{font-family:var(--display);font-size:16px;color:var(--brass);display:block}

/* ---------- flashcard ---------- */
.flash{
  background:var(--deep-2);border:1px solid var(--line-2);border-radius:18px;
  padding:46px 26px;text-align:center;min-height:190px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.flash .front{font-family:var(--display);font-size:40px;font-weight:800;line-height:1.1}
.flash .back{font-size:19px;color:var(--stone-dim)}

/* ---------- misc ---------- */
.note{font-size:13.5px;color:var(--stone-dim);background:rgba(237,231,218,.04);border-left:2px solid var(--brass);padding:10px 13px;border-radius:0 8px 8px 0;margin:10px 0}
.note b{color:var(--brass)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line-2);border-radius:999px;color:var(--stone-dim)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(237,231,218,.25);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:rgba(203,75,60,.12);border:1px solid rgba(203,75,60,.45);border-radius:10px;padding:12px 15px;font-size:14px;margin-top:12px}
.hidden{display:none !important}
hr.rule{border:0;border-top:1px solid var(--line);margin:22px 0}

/* ---------- chat list ---------- */
.chatlist{display:grid;gap:6px;max-height:260px;overflow-y:auto}
.chatrow{display:flex;align-items:center;gap:8px;background:var(--deep);border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer;transition:.13s}
.chatrow:hover{border-color:var(--line-2)}
.chatrow.on{border-color:var(--brass);background:rgba(217,164,65,.07)}
.cmeta{flex:1;min-width:0}
.ct{font-family:var(--display);font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs2{font-size:11px;letter-spacing:.04em;color:var(--stone-dim);text-transform:uppercase}
.cprev{font-size:12.5px;color:var(--stone-dim);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.crn,.cdel{background:none;border:0;color:var(--stone-dim);padding:3px 6px;border-radius:6px;font-size:15px;line-height:1;flex:none}
.crn:hover{color:var(--brass)}
.cdel:hover{color:var(--madder)}
.cdel.armed{color:var(--madder);border:1px solid var(--madder);font-size:11.5px;padding:3px 8px}

/* ---------- settings modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,18,.72);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--deep-2);border:1px solid var(--line-2);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal h2{font-size:26px;margin-bottom:4px}
.field{width:100%;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);padding:11px 14px;border-radius:11px;font-family:var(--mono);font-size:13px}
.field:focus{border-color:var(--brass)}
select.field{font-family:var(--body);font-size:15px}
.gear{background:none;border:1px solid var(--line);color:var(--stone-dim);border-radius:9px;padding:5px 11px;font-size:12.5px;margin-top:10px}
.gear:hover{color:var(--brass);border-color:var(--brass)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{flex-direction:column;gap:0;align-items:center;white-space:nowrap;padding:7px 12px}
  .nav button .en{display:none}
  .rail-foot{margin-top:0}
  .main{padding:22px 16px 70px}
  .word .hr{min-width:110px;font-size:17px}
  .msg{max-width:95%}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#" onclick="go('home');return false">
      <div class="mark">Ple<em>ter</em></div>
      <div class="tag">hrvatski &nbsp;·&nbsp; svaki dan</div>
    </a>

    <button class="gear" onclick="openSettings()"><span class="dot" id="dot"></span><span id="gearlbl">Postavke</span></button>
    <div id="cloudbadge" style="font-size:11.5px;color:var(--olive);letter-spacing:.04em"></div>

    <nav class="nav" id="nav"></nav>

    <div class="rail-foot">
      <div class="stat-row">
        <div class="stat"><b id="s-xp">0</b><span>bodova</span></div>
        <div class="stat"><b id="s-streak">0</b><span>dana</span></div>
        <div class="stat"><b id="s-words">0</b><span>riječi</span></div>
      </div>
      <svg class="pleter" viewBox="0 0 240 26" preserveAspectRatio="none" aria-hidden="true">
        <path class="bg" d="M0,13 C15,1 30,1 45,13 C60,25 75,25 90,13 C105,1 120,1 135,13 C150,25 165,25 180,13 C195,1 210,1 225,13 C232,19 236,21 240,21"/>
        <path class="bg" d="M0,13 C15,25 30,25 45,13 C60,1 75,1 90,13 C105,25 120,25 135,13 C150,1 165,1 180,13 C195,25 210,25 225,13 C232,7 236,5 240,5"/>
        <g id="pl-fill"><path class="fg" id="pl-a" d="M0,13 C15,1 30,1 45,13 C60,25 75,25 90,13 C105,1 120,1 135,13 C150,25 165,25 180,13 C195,1 210,1 225,13 C232,19 236,21 240,21"/>
        <path class="fg" id="pl-b" d="M0,13 C15,25 30,25 45,13 C60,1 75,1 90,13 C105,25 120,25 135,13 C150,1 165,1 180,13 C195,25 210,25 225,13 C232,7 236,5 240,5"/></g>
      </svg>
      <div style="margin-top:8px" id="pl-label">Pleter se plete kako učiš.</div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>
<div id="gloss" class="gloss hidden"></div>
<div id="settings" class="hidden"></div>
<script>
/* ============================================================
   PLETER — hrvatski
   Standard Croatian only: ijekavian, Croatian lexicon.
   ============================================================ */

const VERSION = "3.0";
const ORD = ["","prva","druga","treća","četvrta","peta","šesta","sedma","osma","deveta","deseta","jedanaesta","dvanaesta"];

const UNITS = [
{
  id:1, title:"Pozdravi i predstavljanje", sub:"Greetings & introducing yourself",
  goal:"Say hello, give your name, ask someone theirs, and be polite.",
  grammar:[
    {h:"Formal vs. informal — the single biggest habit to build",
     b:"Croatian splits <em>you</em> in two. <b>ti</b> is one person you know (friends, classmates, family, anyone your age). <b>vi</b> is a stranger, an older person, a teacher, a waiter, anyone in a shop. Using <b>ti</b> with a stranger sounds rude; using <b>vi</b> with a friend sounds cold. When in doubt with an adult you don't know: <b>vi</b>.<br><br>Same question, two forms:<br>Kako <b>si</b>? — How are you? (ti)<br>Kako <b>ste</b>? — How are you? (vi)"},
    {h:"Bok does double duty",
     b:"<b>Bok</b> is <em>both</em> hi and bye, informal. <b>Dobar dan</b> is the safe neutral greeting for any situation from about 10am to evening. <b>Doviđenja</b> is the polite goodbye."},
    {h:"The letters that trip people up",
     b:"<b>c</b> = ts (as in ca<em>ts</em>) — <em>cesta</em> is TSES-ta, never <em>kesta</em>.<br><b>j</b> = y (as in <em>y</em>es) — <em>ja</em> is YAH.<br><b>č</b> = ch, hard (<em>ch</em>urch). <b>ć</b> = ch, soft and lighter.<br><b>š</b> = sh. <b>ž</b> = the s in mea<em>s</em>ure. <b>đ</b> = the j in <em>j</em>eep.<br><b>r</b> is rolled, and can be a whole syllable on its own: <em>prst</em> (finger), <em>vrt</em> (garden), <em>Hrvatska</em>.<br><br>Good news: Croatian spelling is fully phonetic. Every letter is pronounced, always the same way. No silent letters, ever."}
  ],
  vocab:[
    ["bok","hi / bye (informal)"],["dobro jutro","good morning (until ~10am)"],
    ["dobar dan","good day / hello"],["dobra večer","good evening"],
    ["laku noć","good night (going to bed)"],["doviđenja","goodbye (polite)"],
    ["hvala","thank you"],["hvala lijepa","thank you very much"],
    ["molim","please / you're welcome / pardon?"],["nema na čemu","you're welcome"],
    ["oprostite","excuse me / sorry (vi)"],["oprosti","sorry (ti)"],
    ["da","yes"],["ne","no"],["možda","maybe"],
    ["gospodin","Mr / sir"],["gospođa","Mrs / ma'am"]
  ],
  phrases:[
    ["Kako se zoveš?","What's your name? (ti)"],
    ["Kako se zovete?","What's your name? (vi)"],
    ["Zovem se Ana.","My name is Ana."],
    ["Drago mi je.","Nice to meet you."],
    ["Kako si?","How are you? (ti)"],
    ["Dobro sam, hvala. A ti?","I'm well, thanks. And you?"],
    ["Odakle si?","Where are you from?"],
    ["Ja sam iz Amerike.","I'm from America."],
    ["Govorim malo hrvatski.","I speak a little Croatian."],
    ["Ne razumijem.","I don't understand."],
    ["Možete li ponoviti, molim vas?","Could you repeat that, please?"],
    ["Kako se kaže … na hrvatskom?","How do you say … in Croatian?"]
  ],
  drills:[
    {t:"mc",q:"You walk into a bakery at 9am. What do you say?",o:["Laku noć","Dobro jutro","Doviđenja","Bok, stari"],a:1,e:"Dobro jutro — morning greeting, and it's neutral enough for a stranger."},
    {t:"mc",q:"Your teacher asks how you are. Which is right?",o:["Kako si?","Kako ste?","Kako je?","Kako sam?"],a:1,e:"A teacher gets vi, so: Kako ste?"},
    {t:"type",q:"Say: My name is Marko.",a:["zovem se marko","ja se zovem marko"],e:"Zovem se Marko. The verb zvati se is reflexive — the se is part of it and can't be dropped."},
    {t:"type",q:"Say: I don't understand.",a:["ne razumijem","ja ne razumijem"],e:"Ne razumijem. Note the ije — that's the Croatian ijekavian spelling."},
    {t:"mc",q:"How is 'cesta' (road) pronounced?",o:["KES-ta","TSES-ta","CHES-ta","SES-ta"],a:1,e:"Croatian c is always ts. Never k, never s."},
    {t:"type",q:"Say: Nice to meet you.",a:["drago mi je"],e:"Drago mi je — literally 'it is dear to me'."}
  ]
},
{
  id:2, title:"Biti — the verb everything hangs on", sub:"To be, and the pronouns",
  goal:"Build sentences with am / are / is, ask yes-no questions, and negate them.",
  grammar:[
    {h:"Personal pronouns",
     b:"<b>ja</b> I · <b>ti</b> you (one, informal) · <b>on</b> he · <b>ona</b> she · <b>ono</b> it<br><b>mi</b> we · <b>vi</b> you (plural, or one person formally) · <b>oni</b> they (m/mixed) · <b>one</b> they (all f) · <b>ona</b> they (all n)<br><br>You usually <b>drop</b> them. The verb ending already tells you who. <em>Umoran sam</em> is the natural way to say I'm tired; <em>Ja sam umoran</em> adds emphasis, like <em>I'm</em> tired (as opposed to you)."},
    {h:"biti — two present tenses, and it matters",
     b:"<b>Short (unstressed):</b> sam, si, je, smo, ste, su — the everyday form. It can <em>never start a sentence</em>. It sits in second position.<br><b>Long (stressed):</b> jesam, jesi, jest, jesmo, jeste, jesu — used to start yes-no questions, to answer emphatically, and to contradict.<br><br>Ana <b>je</b> ovdje. — Ana is here.<br><b>Jesi</b> li umoran? — Are you tired?<br>— <b>Jesam</b>. — I am.<br><br><b>Negative:</b> nisam, nisi, nije, nismo, niste, nisu. One word, not <em>ne sam</em>.<br>Nisam iz Zagreba. — I'm not from Zagreb."},
    {h:"Two ways to ask a yes-no question",
     b:"1. <b>Jesi li</b> ti student? — Are you a student?<br>2. <b>Je li</b> ovo kava? — Is this coffee? (<em>je li</em> is often heard as <em>jel'</em> in speech)<br><br>The little word <b>li</b> is the question marker and always comes second."},
    {h:"Adjectives change for gender",
     b:"Because <em>umoran</em> describes <em>you</em>, it changes shape depending on whether you're male or female:<br>Umoran sam. (male speaker) · Umorna sam. (female speaker)<br>Gladan sam / Gladna sam. — I'm hungry.<br>Sretan sam / Sretna sam. — I'm happy."}
  ],
  vocab:[
    ["student / studentica","(university) student m/f"],
    ["učenik / učenica","(school) pupil m/f"],
    ["prijatelj / prijateljica","friend m/f"],
    ["dobro","well / good (adv)"],["loše","badly"],["odlično","excellent"],
    ["umoran / umorna","tired m/f"],["gladan / gladna","hungry m/f"],
    ["žedan / žedna","thirsty m/f"],["sretan / sretna","happy m/f"],
    ["ovdje","here"],["tamo","there"],["ovo","this"],["to","that"],
    ["tko","who"],["što","what"],["gdje","where"],["kada","when"],["zašto","why"]
  ],
  phrases:[
    ["Ja sam Amerikanac / Amerikanka.","I'm American m/f."],
    ["Nisam odavde.","I'm not from around here."],
    ["Jesi li ti student?","Are you a student?"],
    ["Je li ovo tvoje?","Is this yours?"],
    ["Ona nije kod kuće.","She isn't at home."],
    ["Mi smo prijatelji.","We are friends."],
    ["Tko je to?","Who is that?"],
    ["Što je ovo?","What is this?"],
    ["Gdje si sada?","Where are you now?"]
  ],
  drills:[
    {t:"type",q:"Say (male speaker): I am tired.",a:["umoran sam","ja sam umoran"],e:"Umoran sam. A woman would say Umorna sam."},
    {t:"mc",q:"Which is a correct sentence?",o:["Sam student.","Ja sam student.","Student sam ja jesam.","Je sam student."],a:1,e:"The short form sam can never open a sentence. Either Ja sam student or Student sam."},
    {t:"type",q:"Say: I'm not from Zagreb.",a:["nisam iz zagreba"],e:"Nisam iz Zagreba. Negation is one word: nisam."},
    {t:"mc",q:"Complete: ___ li ti gladan?",o:["Je","Jesi","Si","Nisi"],a:1,e:"Second person needs jesi, and li marks the question."},
    {t:"type",q:"Say: We are friends.",a:["mi smo prijatelji","smo prijatelji"],e:"Mi smo prijatelji."},
    {t:"mc",q:"A woman says she's hungry:",o:["Gladan sam","Gladna sam","Gladno sam","Gladni sam"],a:1,e:"Feminine adjectives take -a: gladna."}
  ]
},
{
  id:3, title:"Rod i množina", sub:"Gender and plurals",
  goal:"Know whether a noun is m/f/n and make it plural — the foundation for every case later.",
  grammar:[
    {h:"Three genders, and you can usually see them",
     b:"<b>Muški (m)</b> — ends in a consonant: <em>grad, stol, prijatelj, auto</em><br><b>Ženski (f)</b> — ends in <b>-a</b>: <em>žena, knjiga, kava, škola</em><br><b>Srednji (n)</b> — ends in <b>-o</b> or <b>-e</b>: <em>more, selo, pivo, dijete</em><br><br>Reliable exceptions worth memorising now: <b>noć, stvar, ljubav, riječ, večer</b> end in consonants but are <b>feminine</b>. Nouns of that type usually name abstract things."},
    {h:"Making plurals",
     b:"<table><tr><th></th><th>jednina</th><th>množina</th></tr><tr><td class='cs'>m</td><td class='hr'>stol</td><td class='hr'>stolovi</td></tr><tr><td class='cs'>m</td><td class='hr'>prijatelj</td><td class='hr'>prijatelji</td></tr><tr><td class='cs'>f</td><td class='hr'>žena</td><td class='hr'>žene</td></tr><tr><td class='cs'>n</td><td class='hr'>selo</td><td class='hr'>sela</td></tr></table><br><b>m → -i</b> · <b>f → -e</b> · <b>n → -a</b><br><br>Short masculine nouns (one syllable) usually insert <b>-ov-</b> or <b>-ev-</b> first: stol → stol<b>ov</b>i, grad → grad<b>ov</b>i, but after č ć š ž đ j lj nj it's -ev-: muž → muž<b>ev</b>i."},
    {h:"Adjectives agree with the noun",
     b:"An adjective copies its noun's gender and number:<br><b>velik</b> grad · <b>velika</b> kuća · <b>veliko</b> more<br><b>veliki</b> gradovi · <b>velike</b> kuće · <b>velika</b> mora<br><br>Notice masculine plural adjective takes <b>-i</b> and neuter plural takes <b>-a</b> — the same shape as their nouns."},
    {h:"There is no 'a' or 'the'",
     b:"Croatian has no articles at all. <em>Imam knjigu</em> covers both <em>I have a book</em> and <em>I have the book</em>. Context does the work. Don't try to translate <em>the</em> — there's nothing to translate it into."}
  ],
  vocab:[
    ["grad","city"],["selo","village"],["kuća","house"],["stan","apartment"],
    ["soba","room"],["stol","table"],["stolica","chair"],["prozor","window"],
    ["vrata","door (always plural)"],["knjiga","book"],["olovka","pen / pencil"],
    ["more","sea"],["otok","island"],["planina","mountain"],["rijeka","river"],
    ["pas","dog"],["mačka","cat"],["dijete","child (pl. djeca)"],
    ["noć","night (f!)"],["stvar","thing (f!)"],["riječ","word (f!)"]
  ],
  phrases:[
    ["Ovo je velika kuća.","This is a big house."],
    ["Gradovi su lijepi.","The cities are beautiful."],
    ["Hrvatska ima tisuću otoka.","Croatia has a thousand islands."],
    ["More je toplo ljeti.","The sea is warm in summer."],
    ["Imam dva psa.","I have two dogs."]
  ],
  drills:[
    {t:"mc",q:"What gender is 'noć'?",o:["muški","ženski","srednji"],a:1,e:"Feminine, despite the consonant ending. Same group as stvar, riječ, ljubav."},
    {t:"type",q:"Plural of 'knjiga':",a:["knjige"],e:"knjige — feminine nouns take -e."},
    {t:"type",q:"Plural of 'grad':",a:["gradovi"],e:"gradovi — short masculine nouns insert -ov-."},
    {t:"mc",q:"Which is correct?",o:["veliko more","velika more","veliki more","velik more"],a:0,e:"more is neuter, so the adjective is veliko."},
    {t:"type",q:"Say: This is a big city.",a:["ovo je veliki grad","ovo je velik grad"],e:"Ovo je veliki grad. And remember — no word for 'a'."},
    {t:"mc",q:"Plural of 'selo':",o:["seli","sele","sela","selovi"],a:2,e:"Neuter nouns take -a in the plural."}
  ]
},
{
  id:4, title:"Prezent — glagoli u sadašnjosti", sub:"The present tense",
  goal:"Conjugate the three regular patterns plus the irregular verbs you'll use daily.",
  grammar:[
    {h:"Three endings, one system",
     b:"Drop the infinitive <b>-ti</b>, then look at the <em>ja</em> form. It ends in <b>-am</b>, <b>-im</b>, or <b>-em</b>, and that decides the rest.<table><tr><th></th><th>-am · imati</th><th>-im · raditi</th><th>-em · pisati</th></tr><tr><td class='cs'>ja</td><td class='hr'>imam</td><td class='hr'>radim</td><td class='hr'>pišem</td></tr><tr><td class='cs'>ti</td><td class='hr'>imaš</td><td class='hr'>radiš</td><td class='hr'>pišeš</td></tr><tr><td class='cs'>on/ona</td><td class='hr'>ima</td><td class='hr'>radi</td><td class='hr'>piše</td></tr><tr><td class='cs'>mi</td><td class='hr'>imamo</td><td class='hr'>radimo</td><td class='hr'>pišemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>imate</td><td class='hr'>radite</td><td class='hr'>pišete</td></tr><tr><td class='cs'>oni</td><td class='hr'>imaju</td><td class='hr'>rade</td><td class='hr'>pišu</td></tr></table>The endings after the first letter are identical: -m, -š, -, -mo, -te, and then -ju / -e / -u."},
    {h:"The irregulars you can't avoid",
     b:"<table><tr><th></th><th>ići (go)</th><th>moći (can)</th><th>htjeti (want)</th></tr><tr><td class='cs'>ja</td><td class='hr'>idem</td><td class='hr'>mogu</td><td class='hr'>hoću</td></tr><tr><td class='cs'>ti</td><td class='hr'>ideš</td><td class='hr'>možeš</td><td class='hr'>hoćeš</td></tr><tr><td class='cs'>on</td><td class='hr'>ide</td><td class='hr'>može</td><td class='hr'>hoće</td></tr><tr><td class='cs'>mi</td><td class='hr'>idemo</td><td class='hr'>možemo</td><td class='hr'>hoćemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>idete</td><td class='hr'>možete</td><td class='hr'>hoćete</td></tr><tr><td class='cs'>oni</td><td class='hr'>idu</td><td class='hr'>mogu</td><td class='hr'>hoće</td></tr></table>Negative of htjeti: <b>neću, nećeš, neće, nećemo, nećete, neće</b> — written as one word."},
    {h:"Negation",
     b:"Put <b>ne</b> in front, as a separate word: <em>Ne radim danas.</em> Only three verbs fuse: <b>nisam</b> (biti), <b>nemam</b> (imati), <b>neću</b> (htjeti)."},
    {h:"Double negatives are required",
     b:"Where English says <em>I don't know anything</em>, Croatian says <em>I don't know nothing</em> — and it's correct:<br><b>Ne znam ništa.</b> · <b>Nikad ne idem tamo.</b> · <b>Nitko nije ovdje.</b><br>Leaving out the <em>ne</em> is the mistake."}
  ],
  vocab:[
    ["imati","to have (imam)"],["raditi","to work / to do (radim)"],
    ["govoriti","to speak (govorim)"],["učiti","to learn / study (učim)"],
    ["znati","to know (znam)"],["misliti","to think (mislim)"],
    ["živjeti","to live (živim)"],["gledati","to watch (gledam)"],
    ["slušati","to listen (slušam)"],["čitati","to read (čitam)"],
    ["pisati","to write (pišem)"],["jesti","to eat (jedem)"],
    ["piti","to drink (pijem)"],["ići","to go (idem)"],
    ["moći","can (mogu)"],["htjeti","to want (hoću)"],
    ["trebati","to need (trebam)"],["voljeti","to love (volim)"],
    ["razumjeti","to understand (razumijem)"]
  ],
  phrases:[
    ["Učim hrvatski.","I'm learning Croatian."],
    ["Ne znam.","I don't know."],
    ["Što radiš?","What are you doing?"],
    ["Idem u školu.","I'm going to school."],
    ["Možeš li mi pomoći?","Can you help me?"],
    ["Hoću kavu.","I want a coffee."],
    ["Ne razumijem ništa.","I don't understand anything."],
    ["Volim hrvatsku glazbu.","I love Croatian music."]
  ],
  drills:[
    {t:"type",q:"Conjugate: mi + raditi",a:["radimo"],e:"radimo"},
    {t:"type",q:"Say: I'm learning Croatian.",a:["učim hrvatski","ja učim hrvatski"],e:"Učim hrvatski. Croatian has no separate continuous tense — prezent covers both I learn and I'm learning."},
    {t:"mc",q:"Which means 'I can't'?",o:["Ne mogu","Nemogu","Nisam moći","Ne možem"],a:0,e:"Ne mogu — two words. Only nisam, nemam and neću fuse."},
    {t:"type",q:"Say: I don't know anything.",a:["ne znam ništa"],e:"Ne znam ništa — the double negative is obligatory in Croatian."},
    {t:"mc",q:"oni + ići =",o:["ide","idu","idete","idemo"],a:1,e:"idu"},
    {t:"type",q:"Say: What are you doing? (to a friend)",a:["što radiš","sto radis"],e:"Što radiš? Note što, not šta — that's the Croatian standard form."}
  ]
},
{
  id:5, title:"Brojevi, sati i dani", sub:"Numbers, time and the calendar",
  goal:"Count, tell time, name the days and the months — and Croatian months are nothing like English.",
  grammar:[
    {h:"1–20",
     b:"nula, <b>jedan</b>, dva, tri, četiri, pet, šest, sedam, osam, devet, deset,<br>jedanaest, dvanaest, trinaest, četrnaest, petnaest, šesnaest, sedamnaest, osamnaest, devetnaest, dvadeset.<br><br>From 11 up they're all just <em>digit + naest</em>. Tens: dvadeset, trideset, četrdeset, pedeset, šezdeset, sedamdeset, osamdeset, devedeset, <b>sto</b>, <b>tisuća</b>."},
    {h:"What follows a number — the rule that surprises everyone",
     b:"<b>1</b> → normal singular: <em>jedan stol, jedna kava</em><br><b>2, 3, 4</b> (and anything ending in them) → <em>dva stol<b>a</b>, tri kav<b>e</b></em><br><b>5 and up</b> → <em>pet stol<b>ova</b>, šest kav<b>a</b></em><br><br>So: <em>jedna kava, dvije kave, pet kava</em>. Also note <b>dva</b> for m/n but <b>dvije</b> for feminine."},
    {h:"Telling time",
     b:"<b>Koliko je sati?</b> — What time is it?<br>Jedan sat · Dva sata · Pet sati (the number rule again)<br><b>Pola tri</b> = 2:30 — literally <em>half three</em>, meaning half way <em>to</em> three. This catches everyone. Pola tri is NOT 3:30.<br>Deset i petnaest — 10:15 · Deset do pet — ten to five<br>U koliko sati? — At what time? · <b>U</b> osam sati."},
    {h:"Days and months",
     b:"<b>Dani:</b> ponedjeljak, utorak, srijeda, četvrtak, petak, subota, nedjelja.<br>The week starts Monday. <em>Nedjelja</em> is Sunday; the word for <em>week</em> is <b>tjedan</b>.<br><br><b>Mjeseci</b> — Croatian keeps the old Slavic names, and they describe nature, not Roman emperors:<br>siječanj, veljača, ožujak, travanj, svibanj, lipanj, srpanj, kolovoz, rujan, listopad, studeni, prosinac.<br><em>Listopad</em> (October) means leaf-fall. <em>Travanj</em> (April) is from grass. These have to be memorised — there's no shortcut, but they're one of the most distinctly Croatian things in the language."}
  ],
  vocab:[
    ["sat","hour / clock"],["minuta","minute"],["dan","day"],["tjedan","week"],
    ["mjesec","month / moon"],["godina","year"],["danas","today"],
    ["jučer","yesterday"],["sutra","tomorrow"],["sada","now"],
    ["ujutro","in the morning"],["popodne","in the afternoon"],
    ["navečer","in the evening"],["uvijek","always"],["nikad","never"],
    ["ponekad","sometimes"],["često","often"],["rano","early"],["kasno","late"]
  ],
  phrases:[
    ["Koliko je sati?","What time is it?"],
    ["Sada je pola tri.","It's half past two."],
    ["U koliko sati počinje?","What time does it start?"],
    ["Danas je srijeda.","Today is Wednesday."],
    ["Vidimo se sutra!","See you tomorrow!"],
    ["Imam sedamnaest godina.","I'm seventeen years old."],
    ["Rođen sam u lipnju.","I was born in June. (m)"]
  ],
  drills:[
    {t:"type",q:"What is 'pola tri' in digits? (e.g. 4:30)",a:["2:30","230","14:30"],e:"2:30. Pola tri = half way to three, not half past three."},
    {t:"mc",q:"Which is October?",o:["kolovoz","listopad","studeni","rujan"],a:1,e:"listopad — 'leaf-fall'. kolovoz is August, rujan September, studeni November."},
    {t:"type",q:"Say: Today is Monday.",a:["danas je ponedjeljak"],e:"Danas je ponedjeljak."},
    {t:"mc",q:"Correct form after 'pet':",o:["pet kava","pet kave","pet kavu","pet kavi"],a:0,e:"Five and up takes the genitive plural: pet kava."},
    {t:"type",q:"Say: I'm seventeen years old.",a:["imam sedamnaest godina"],e:"Imam sedamnaest godina — literally 'I have seventeen years'."},
    {t:"mc",q:"'tjedan' means:",o:["Sunday","week","month","Tuesday"],a:1,e:"tjedan = week. nedjelja = Sunday."}
  ]
},
{
  id:6, title:"Akuzativ — the object of the sentence", sub:"Your first case",
  goal:"Say what you have, want, see, eat and drink — the case you'll use most.",
  grammar:[
    {h:"What a case actually is",
     b:"English shows who-does-what by word order: <em>the dog bites the man</em> ≠ <em>the man bites the dog</em>. Croatian marks it on the <b>word ending</b> instead, so word order is free. <em>Ana voli Marka</em> and <em>Marka voli Ana</em> both mean Ana loves Marko — the <b>-a</b> on Marko is what tells you he's the one being loved.<br><br>The <b>akuzativ</b> marks the direct object: the thing being had, wanted, seen, eaten, bought."},
    {h:"The endings",
     b:"<table><tr><th>gender</th><th>nominativ</th><th>akuzativ</th></tr><tr><td class='cs'>f</td><td class='hr'>kava</td><td class='hr'>kavu</td></tr><tr><td class='cs'>n</td><td class='hr'>pivo</td><td class='hr'>pivo</td></tr><tr><td class='cs'>m inanimate</td><td class='hr'>stol</td><td class='hr'>stol</td></tr><tr><td class='cs'>m animate</td><td class='hr'>pas</td><td class='hr'>psa</td></tr></table><b>Feminine -a → -u.</b> That's the one that changes most visibly, and it's the single most useful ending in the language.<br><br>Neuter never changes. Masculine changes <b>only if it's alive</b> — people and animals take <b>-a</b>; objects stay identical."},
    {h:"Alive or not — why it matters",
     b:"Vidim <b>stol</b>. — I see the table. (object, no change)<br>Vidim <b>psa</b>. — I see the dog. (alive, takes -a)<br>Vidim <b>Marka</b>. — I see Marko. (a person, takes -a)<br><br>Adjectives follow along: Imam <b>velikog</b> psa. Imam <b>veliku</b> kuću."},
    {h:"Ordering things politely",
     b:"<b>Molim vas jednu kavu.</b> — A coffee, please. (kava → kavu)<br><b>Htio bih</b> / <b>Htjela bih</b> jedno pivo. — I'd like a beer. (m / f speaker)<br><b>Želim čašu vode.</b> — I want a glass of water.<br><br><em>Htio/htjela bih</em> is softer and more polite than <em>hoću</em>. Use it in shops and cafés."}
  ],
  vocab:[
    ["kava","coffee"],["čaj","tea"],["voda","water"],["mlijeko","milk"],
    ["sok","juice"],["pivo","beer"],["vino","wine"],["kruh","bread"],
    ["sir","cheese"],["meso","meat"],["riba","fish"],["juha","soup"],
    ["salata","salad"],["voće","fruit"],["povrće","vegetables"],
    ["jabuka","apple"],["rajčica","tomato"],["krumpir","potato"],
    ["kolač","cake"],["sladoled","ice cream"],["račun","the bill"]
  ],
  phrases:[
    ["Molim vas jednu kavu.","One coffee, please."],
    ["Htio bih jedno pivo.","I'd like a beer. (m)"],
    ["Htjela bih čašu vode.","I'd like a glass of water. (f)"],
    ["Imam veliku kuću.","I have a big house."],
    ["Vidim Marka.","I see Marko."],
    ["Jedem kruh i sir.","I'm eating bread and cheese."],
    ["Račun, molim vas.","The bill, please."],
    ["Što preporučujete?","What do you recommend?"]
  ],
  drills:[
    {t:"type",q:"Say: I'd like one coffee, please. (polite, ordering)",a:["molim vas jednu kavu","htio bih jednu kavu","htjela bih jednu kavu"],e:"Molim vas jednu kavu. kava → kavu in the accusative."},
    {t:"mc",q:"Vidim ___ . (pas)",o:["pas","psu","psa","pasa"],a:2,e:"pas is animate, so accusative takes -a: psa."},
    {t:"mc",q:"Vidim ___ . (stol)",o:["stol","stola","stolu","stolom"],a:0,e:"stol is an inanimate object — no change in the accusative."},
    {t:"type",q:"Say: I have a big house.",a:["imam veliku kuću","imam veliku kucu"],e:"Imam veliku kuću — both adjective and noun take the feminine accusative -u."},
    {t:"type",q:"Say: The bill, please.",a:["račun molim vas","racun molim vas","račun molim","molim vas račun"],e:"Račun, molim vas."},
    {t:"mc",q:"Why does 'pivo' stay 'pivo' in the accusative?",o:["It's feminine","It's neuter and neuter never changes","It's plural","It's animate"],a:1,e:"Neuter nouns are identical in nominative and accusative."}
  ]
},
{
  id:7, title:"Genitiv", sub:"Of, from, without, and none",
  goal:"Show possession, use the most common prepositions, and handle negation and quantities.",
  grammar:[
    {h:"The endings",
     b:"<table><tr><th>gender</th><th>N</th><th>G</th></tr><tr><td class='cs'>m</td><td class='hr'>grad</td><td class='hr'>grada</td></tr><tr><td class='cs'>f</td><td class='hr'>kuća</td><td class='hr'>kuće</td></tr><tr><td class='cs'>n</td><td class='hr'>more</td><td class='hr'>mora</td></tr></table>m/n take <b>-a</b>, f takes <b>-e</b>. Genitive plural is usually <b>-a</b> for m and f (gradova, kuća) — a long, distinctive ending."},
    {h:"Four jobs the genitive does",
     b:"<b>1 · Possession</b> — where English uses <em>of</em> or <em>'s</em>:<br>knjiga <b>profesora</b> — the professor's book · centar <b>grada</b> — the city centre<br><br><b>2 · After these prepositions</b>: <b>iz</b> (from/out of), <b>od</b> (from), <b>do</b> (to/until), <b>bez</b> (without), <b>kod</b> (at someone's place), <b>blizu</b> (near), <b>poslije</b> (after), <b>prije</b> (before):<br>Ja sam iz <b>Amerike</b>. · Kava bez <b>šećera</b>. · Kod <b>doktora</b> sam.<br><br><b>3 · After quantities</b> — 5+, and words like <em>puno, malo, čaša, boca</em>:<br>puno <b>ljudi</b> · čaša <b>vode</b> · pet <b>eura</b><br><br><b>4 · After 'nema'</b> — to say something isn't there:<br><b>Nema</b> kruha. — There's no bread. · <b>Nema</b> problema. — No problem."},
    {h:"ima / nema",
     b:"<b>Ima</b> + noun = there is / there are. <b>Nema</b> + <em>genitive</em> = there isn't.<br>Ima kruha? — Is there bread?<br>Nema mlijeka. — There's no milk.<br>Ima li ovdje WC? — Is there a toilet here?"}
  ],
  vocab:[

    ["do","to / until (+G)"],["kod","at (someone's) (+G)"],["blizu","near (+G)"],
    ["poslije","after (+G)"],["prije","before (+G)"],["oko","around (+G)"],
    ["puno / mnogo","a lot of (+G)"],["malo","a little (+G)"],
    ["šećer","sugar"],["sol","salt"],["novac","money"],["ljudi","people"],

  ],
  phrases:[

    ["Nema problema.","No problem."],

  drills:[
    {t:"type",q:"Say: Coffee without sugar.",a:["kava bez šećera","kava bez secera"],e:"Kava bez šećera — bez always takes the genitive."},
    {t:"mc",q:"Ja sam iz ___ . (Hrvatska)",o:["Hrvatska","Hrvatsku","Hrvatske","Hrvatskoj"],a:2,e:"iz + genitive, and feminine genitive is -e: Hrvatske."},
    {t:"type",q:"Say: There's no bread.",a:["nema kruha"],e:"Nema kruha — nema is followed by the genitive."},
    {t:"mc",q:"Which preposition does NOT take the genitive?",o:["bez","kod","do","u"],a:3,e:"u takes accusative (motion) or locative (position), never genitive."},
    {t:"type",q:"Say: No problem.",a:["nema problema"],e:"Nema problema."},
    {t:"mc",q:"'čaša ___' — a glass of water",o:["voda","vodu","vode","vodom"],a:2,e:"Quantity words take the genitive: čaša vode."}

},
{
  id:8, title:"Lokativ i kretanje", sub:"Where you are vs. where you're going",
  goal:"Master the u/na split — the distinction that makes you sound like you know the language.",
  grammar:[
    {h:"The core contrast",
     b:"The <em>same</em> preposition takes a <b>different case</b> depending on whether there's movement.<br><br><b>Motion → akuzativ:</b> Idem <b>u Zagreb</b>. — I'm going to Zagreb.<br><b>Position → lokativ:</b> Ja sam <b>u Zagrebu</b>. — I'm in Zagreb.<br><br>Idem <b>u školu</b>. (to school) vs. Ja sam <b>u školi</b>. (at school)<br>Idem <b>na plažu</b>. (to the beach) vs. Ja sam <b>na plaži</b>. (at the beach)<br><br>Ask yourself: am I <em>arriving</em> or am I <em>already there</em>?"},
    {h:"Locative endings",
     b:"<table><tr><th>gender</th><th>N</th><th>L</th></tr><tr><td class='cs'>m</td><td class='hr'>grad</td><td class='hr'>gradu</td></tr><tr><td class='cs'>f</td><td class='hr'>škola</td><td class='hr'>školi</td></tr><tr><td class='cs'>n</td><td class='hr'>more</td><td class='hr'>moru</td></tr></table>m/n take <b>-u</b>, f takes <b>-i</b>. The locative <em>only</em> appears after a preposition — never alone.<br><br>Used with: <b>u</b> (in), <b>na</b> (on/at), <b>o</b> (about), <b>po</b> (around), <b>pri</b> (near)."},
    {h:"u or na? Croatian just decides",
     b:"Some places take <b>u</b>, some take <b>na</b>, and you memorise them:<br><b>u</b> — u školi, u kući, u gradu, u kinu, u trgovini, u banci, u Hrvatskoj<br><b>na</b> — na poslu (at work), na plaži, na moru, na fakultetu, na ulici, na otoku, na kolodvoru, na tržnici<br><br>Rough logic: <em>na</em> tends to go with open surfaces, islands, and events, but the safest approach is to learn each place with its preposition attached."},
    {h:"Asking and answering",
     b:"<b>Gdje?</b> — Where (are you)? → locative<br><b>Kamo?</b> / <b>Gdje ideš?</b> — Where to? → accusative<br><b>Odakle?</b> — Where from? → genitive<br><br>Gdje si? — Na poslu sam.<br>Kamo ideš? — Idem u kino."}
  ],
  vocab:[
    ["škola","school"],["posao","work / job"],["fakultet","university faculty"],
    ["trgovina","shop"],["tržnica","market"],["kino","cinema"],
    ["kazalište","theatre"],["restoran","restaurant"],["kafić","café"],
    ["plaža","beach"],["ulica","street"],["trg","square"],
    ["kolodvor","station"],["zračna luka","airport"],["bolnica","hospital"],
    ["banka","bank"],["park","park"],["knjižnica","library"],["muzej","museum"]
  ],
  phrases:[
    ["Gdje si?","Where are you?"],
    ["U školi sam.","I'm at school."],
    ["Na poslu sam.","I'm at work."],
    ["Idem u kino.","I'm going to the cinema."],
    ["Živim u Zagrebu.","I live in Zagreb."],
    ["Ljeti smo na moru.","In summer we're at the seaside."],
    ["Razgovaramo o filmu.","We're talking about the film."],
    ["Gdje je kolodvor?","Where is the station?"]
  ],
  drills:[
    {t:"mc",q:"Idem ___ . (Zagreb — I'm going there)",o:["u Zagreb","u Zagrebu","iz Zagreba","na Zagreb"],a:0,e:"Motion takes the accusative, which for Zagreb looks the same as the nominative."},
    {t:"mc",q:"Ja sam ___ . (Zagreb — I'm there now)",o:["u Zagreb","u Zagrebu","do Zagreba","na Zagrebu"],a:1,e:"Position takes the locative: u Zagrebu."},
    {t:"type",q:"Say: I'm at work.",a:["na poslu sam","ja sam na poslu"],e:"Na poslu sam — work takes na, not u."},
    {t:"type",q:"Say: I live in Croatia.",a:["živim u hrvatskoj","zivim u hrvatskoj"],e:"Živim u Hrvatskoj."},
    {t:"mc",q:"Which is right?",o:["Idem na plaži","Idem u plažu","Idem na plažu","Sam na plažu"],a:2,e:"Motion + na = accusative: na plažu."},
    {t:"type",q:"Say: I'm at school.",a:["u školi sam","ja sam u školi","u skoli sam"],e:"U školi sam."}
  ]
},
{
  id:9, title:"Perfekt — prošlo vrijeme", sub:"The past tense",
  goal:"Talk about yesterday, last week and your whole life — in one simple pattern.",
  grammar:[
    {h:"Two pieces, and that's it",
     b:"<b>Past participle + short form of biti.</b><br><br>Take the infinitive, drop <b>-ti</b>, add:<br><b>-o</b> (male speaker) · <b>-la</b> (female) · <b>-lo</b> (neuter) · <b>-li</b> (plural m/mixed) · <b>-le</b> (plural f)<br><br>raditi → radi<b>o</b> sam / radi<b>la</b> sam — I worked<br>učiti → uči<b>o</b> si / uči<b>la</b> si — you studied<br>gledati → gleda<b>li</b> smo — we watched"},
    {h:"The participle agrees with the SPEAKER, not the object",
     b:"This is the part English speakers forget. The ending tells you the gender of whoever did the action:<br><br>Bio sam u Splitu. (a man says this)<br>Bila sam u Splitu. (a woman says this)<br>Bili smo u Splitu. (a group)<br><br>So every time you talk about your own past, you have to know your own ending. Pick yours now and drill it."},
    {h:"biti in the past, and negation",
     b:"bio / bila / bilo / bili / bile + sam, si, je, smo, ste, su<br><br><b>Negative:</b> swap the short form for nisam/nisi/nije/nismo/niste/nisu, and the participle moves after it:<br><b>Nisam radio</b> jučer. — I didn't work yesterday.<br><b>Nije bila</b> ovdje. — She wasn't here.<br><br><b>Question:</b> Jesi li bio u Hrvatskoj? — Have you been to Croatia?"},
    {h:"Word order — the second-position rule",
     b:"<em>sam, si, je, smo, ste, su</em> are clitics: they must sit in <b>second position</b> in the clause.<br>✓ Radio sam. ✓ Jučer sam radio. ✓ U Zagrebu sam radio.<br>✗ Sam radio. ✗ Jučer radio sam.<br><br>Whatever you put first, the clitic comes right after it."}
  ],
  vocab:[
    ["prošli tjedan","last week"],["prošle godine","last year"],
    ["sinoć","last night"],["prekjučer","the day before yesterday"],
    ["nedavno","recently"],["već","already"],["još ne","not yet"],
    ["putovati","to travel (putujem)"],["doći","to come (dođem)"],
    ["otići","to leave (odem)"],["kupiti","to buy (kupim)"],
    ["vidjeti","to see (vidim)"],["reći","to say (kažem)"],
    ["pitati","to ask (pitam)"],["odgovoriti","to answer (odgovorim)"],
    ["spavati","to sleep (spavam)"],["ustati","to get up (ustanem)"]
  ],
  phrases:[
    ["Jučer sam radio.","I worked yesterday. (m)"],
    ["Bila sam u Splitu prošle godine.","I was in Split last year. (f)"],
    ["Jesi li bio u Hrvatskoj?","Have you been to Croatia? (m)"],
    ["Nismo išli na more.","We didn't go to the seaside."],
    ["Što si radio sinoć?","What did you do last night?"],
    ["Kupio sam novu knjigu.","I bought a new book. (m)"],
    ["Nisam još jeo.","I haven't eaten yet. (m)"]
  ],
  drills:[
    {t:"type",q:"Say (female speaker): I was in Split.",a:["bila sam u splitu","ja sam bila u splitu"],e:"Bila sam u Splitu. A man would say Bio sam."},
    {t:"mc",q:"Which is correctly ordered?",o:["Sam radio jučer.","Jučer radio sam.","Jučer sam radio.","Radio jučer sam."],a:2,e:"The clitic sam must be in second position."},
    {t:"type",q:"Say (male speaker): I didn't work yesterday.",a:["nisam radio jučer","jučer nisam radio","nisam jučer radio"],e:"Nisam radio jučer."},
    {t:"mc",q:"'gledati' → past participle, plural mixed group:",o:["gledao","gledala","gledali","gledale"],a:2,e:"gledali — plural masculine or mixed."},
    {t:"type",q:"Ask a male friend: Have you been to Croatia?",a:["jesi li bio u hrvatskoj"],e:"Jesi li bio u Hrvatskoj?"},
    {t:"mc",q:"A woman says 'we were' about herself and her sister:",o:["Bili smo","Bile smo","Bila smo","Bilo smo"],a:1,e:"An all-female group takes -le: bile smo."}
  ]
},
{
  id:10, title:"Futur i uvjetni način", sub:"The future, and being polite",
  goal:"Make plans, offer, and soften requests so you don't sound blunt.",
  grammar:[
    {h:"Futur I",
     b:"<b>Short form of htjeti + infinitive:</b> ću, ćeš, će, ćemo, ćete, će<br><br><b>Radit ću</b> sutra. — I'll work tomorrow.<br><b>Ići ćemo</b> na more. — We'll go to the seaside.<br>Što <b>ćeš raditi</b>? — What will you do?<br><br>Note the spelling: when the verb comes first, the infinitive drops its final <b>-i</b> and stays a separate word — <b>radit ću</b>, not <em>raditi ću</em> and not <em>radiću</em>. Writing it as one word is a Serbian convention, not Croatian."},
    {h:"Negative and question",
     b:"<b>Neću raditi.</b> — I won't work. (full form + infinitive, normal order)<br><b>Hoćeš li doći?</b> — Will you come?<br><b>Nećemo ići.</b> — We won't go."},
    {h:"Kondicional — the politeness engine",
     b:"<b>bih, bi, bi, bismo, biste, bi</b> + past participle<br><br><b>Htio bih</b> / <b>Htjela bih</b> kavu. — I'd like a coffee.<br><b>Mogli biste</b> mi pomoći? — Could you help me?<br><b>Volio bih</b> ići u Dubrovnik. — I'd love to go to Dubrovnik.<br><br>In everyday shops and cafés this is what you actually want. <em>Hoću kavu</em> is grammatical but reads as demanding; <em>Htio bih kavu</em> is what a polite person says."},
    {h:"Imperativ — giving instructions",
     b:"Formed off the present stem:<br>Čekaj! / Čekajte! — Wait!<br>Dođi! / Dođite! — Come!<br>Oprosti! / Oprostite! — Sorry!<br>Idemo! — Let's go!<br><br>The <b>-te</b> ending is the vi form. Negative: <b>nemoj</b> / <b>nemojte</b> + infinitive — <em>Nemoj ići!</em> Don't go!"}
  ],
  vocab:[
    ["sutra","tomorrow"],["prekosutra","the day after tomorrow"],
    ["sljedeći tjedan","next week"],["uskoro","soon"],["kasnije","later"],
    ["planirati","to plan"],["putovanje","a trip"],["odmor","holiday / rest"],
    ["ljeto","summer"],["zima","winter"],["proljeće","spring"],["jesen","autumn"],
    ["nadam se","I hope"],["možda","maybe"],["sigurno","surely / definitely"],
    ["obećati","to promise"],["čekati","to wait"],["pomoći","to help"]
  ],
  phrases:[
    ["Što ćeš raditi sutra?","What will you do tomorrow?"],
    ["Ići ćemo na more.","We'll go to the seaside."],
    ["Neću ići.","I won't go."],
    ["Htio bih rezervirati stol.","I'd like to book a table. (m)"],
    ["Možete li mi pomoći, molim vas?","Could you help me, please?"],
    ["Vidimo se sljedeći tjedan.","See you next week."],
    ["Nadam se da ćeš doći.","I hope you'll come."]
  ],
  drills:[
    {t:"mc",q:"Which spelling is standard Croatian?",o:["Radiću sutra.","Raditi ću sutra.","Radit ću sutra.","Radit-ću sutra."],a:2,e:"Radit ću — infinitive loses -i, stays a separate word. The one-word form is Serbian."},
    {t:"type",q:"Say: We'll go to the seaside.",a:["ići ćemo na more","ici cemo na more","mi ćemo ići na more"],e:"Ići ćemo na more."},
    {t:"type",q:"Say politely (male speaker): I'd like a coffee.",a:["htio bih kavu"],e:"Htio bih kavu. A woman says Htjela bih kavu."},
    {t:"mc",q:"'I won't come' =",o:["Ne ću doći","Neću doći","Nisam doći","Ne hoću dolaziti"],a:1,e:"Neću doći — written as one word in modern standard Croatian."},
    {t:"type",q:"Say: Could you help me, please? (formal)",a:["možete li mi pomoći molim vas","mozete li mi pomoci molim vas","možete li mi pomoći"],e:"Možete li mi pomoći, molim vas?"},
    {t:"mc",q:"Polite imperative 'Wait!' to a stranger:",o:["Čekaj!","Čekajte!","Čekamo!","Čekati!"],a:1,e:"The -te ending is the vi form."}
  ]
},
{
  id:11, title:"Dativ i instrumental", sub:"To whom, and with what",
  goal:"Complete all seven cases and handle giving, sending, liking and going with people.",
  grammar:[
    {h:"Dativ — the indirect object",
     b:"Endings are the <em>same as the locative</em>: m/n <b>-u</b>, f <b>-i</b>. The difference is that the dative works without a preposition.<br><br>Dajem knjigu <b>prijatelju</b>. — I'm giving the book to my friend.<br>Pišem <b>Ani</b>. — I'm writing to Ana.<br>Kako <b>ti</b> se sviđa? — How do you like it?<br><br>Also used after <b>prema</b> (towards) and <b>zahvaljujući</b> (thanks to)."},
    {h:"Sviđati se — how liking works",
     b:"Croatian flips it. The thing you like is the <em>subject</em>, and you are in the dative — literally <em>it is pleasing to me</em>:<br><br><b>Sviđa mi se</b> Zagreb. — I like Zagreb.<br><b>Sviđaju mi se</b> ove knjige. — I like these books. (plural thing → plural verb)<br>Kako ti se sviđa Hrvatska? — How do you like Croatia?<br><br>Compare <b>voljeti</b>, which is normal: <em>Volim Zagreb.</em> Use <em>voljeti</em> for love and strong preference, <em>sviđati se</em> for ordinary liking."},
    {h:"Instrumental — with, and by means of",
     b:"m/n take <b>-om</b>, f takes <b>-om</b> too (from -a).<br>(After č ć š ž đ j lj nj, use <b>-em</b>: <em>s prijateljem</em>, <em>nožem</em>.)<br><br><b>With a person → use s / sa:</b><br>Idem <b>s prijateljem</b>. — I'm going with a friend.<br>Kava <b>s mlijekom</b>. — Coffee with milk.<br><br><b>By means of → no preposition:</b><br>Idem <b>autobusom</b>. — I go by bus.<br>Pišem <b>olovkom</b>. — I write with a pen.<br><br>That contrast is the whole trick: a companion needs <em>s</em>, a tool doesn't."},
    {h:"All seven, in order",
     b:"<b>Nominativ</b> (tko? što?) — the subject<br><b>Genitiv</b> (koga? čega?) — of, from, without<br><b>Dativ</b> (komu? čemu?) — to, for<br><b>Akuzativ</b> (koga? što?) — the object<br><b>Vokativ</b> — calling someone: <em>Ana → Ano! Marko → Marko! prijatelj → prijatelju!</em><br><b>Lokativ</b> (o komu? o čemu?) — position, about<br><b>Instrumental</b> (s kim? čime?) — with, by<br><br>Croatian speakers memorise them in exactly this order in school. Learning the order pays off, because reference tables everywhere use it."}
  ],
  vocab:[
    ["dati","to give (dam)"],["poslati","to send (pošaljem)"],
    ["pokazati","to show (pokažem)"],["pomagati","to help (pomažem)"],
    ["sviđati se","to be pleasing / to like"],["s / sa","with (+I)"],
    ["autobus","bus"],["vlak","train"],["auto","car"],["bicikl","bicycle"],
    ["zrakoplov","aeroplane"],["brod","boat / ship"],["pješice","on foot"],
    ["obitelj","family (f)"],["majka","mother"],["otac","father"],
    ["brat","brother"],["sestra","sister"],["djed","grandfather"],["baka","grandmother"]
  ],
  phrases:[
    ["Sviđa mi se Zagreb.","I like Zagreb."],
    ["Kako ti se sviđa Hrvatska?","How do you like Croatia?"],
    ["Idem s prijateljem.","I'm going with a friend."],
    ["Putujem vlakom.","I'm travelling by train."],
    ["Kava s mlijekom, molim.","Coffee with milk, please."],
    ["Dajem knjigu sestri.","I'm giving the book to my sister."],
    ["Živim s obitelji.","I live with my family."]
  ],
  drills:[
    {t:"type",q:"Say: I like Zagreb.",a:["sviđa mi se zagreb","svida mi se zagreb"],e:"Sviđa mi se Zagreb — literally 'Zagreb is pleasing to me'."},
    {t:"mc",q:"'I'm going by bus' =",o:["Idem s autobusom","Idem autobusom","Idem u autobusu","Idem autobus"],a:1,e:"A means of transport takes bare instrumental — no s."},
    {t:"mc",q:"'I'm going with a friend' =",o:["Idem prijateljem","Idem s prijateljem","Idem prijatelju","Idem za prijatelja"],a:1,e:"A companion needs s + instrumental."},
    {t:"type",q:"Say: Coffee with milk, please.",a:["kava s mlijekom molim","kava s mlijekom molim vas"],e:"Kava s mlijekom, molim."},
    {t:"mc",q:"Which case answers 'komu?'",o:["genitiv","dativ","lokativ","instrumental"],a:1,e:"Dativ — to whom."},
    {t:"type",q:"Say: I live with my family.",a:["živim s obitelji","zivim s obitelji","živim sa obitelji"],e:"Živim s obitelji."}

},
{
  id:12, title:"Svakodnevni razgovor", sub:"Putting it together",
  goal:"Handle a real conversation: opinions, small talk, problems, and keeping it going.",
  grammar:[
    {h:"Opinions and reactions",
     b:"<b>Mislim da…</b> — I think that…<br><b>Slažem se.</b> — I agree. · <b>Ne slažem se.</b> — I disagree.<br><b>Imaš pravo.</b> — You're right.<br><b>Nije mi jasno.</b> — It's not clear to me.<br><b>Ovisi.</b> — It depends.<br><b>Baš me zanima.</b> — I'm really curious.<br><br><b>Da</b> here means <em>that</em> (a conjunction), not <em>yes</em>. Context tells them apart."},
    {h:"Buying yourself time — memorise these",
     b:"When you're stuck mid-sentence, these keep the conversation alive instead of killing it:<br><b>Kako da kažem…</b> — How do I put it…<br><b>Samo malo.</b> — Just a moment.<br><b>Ne znam kako se kaže na hrvatskom.</b> — I don't know how to say it in Croatian.<br><b>Možete li govoriti sporije?</b> — Could you speak more slowly?<br><b>Što znači to?</b> — What does that mean?<br><br>Fluency is much more about recovering smoothly than about never making mistakes."},
    {h:"Comparatives",
     b:"Add <b>-iji</b> (or -ji) and use <b>od</b> + genitive, or <b>nego</b>:<br>Zagreb je <b>veći od</b> Splita. — Zagreb is bigger than Split.<br>Ovo je <b>bolje nego</b> ono. — This is better than that.<br><br>Irregulars you'll actually use: dobar → <b>bolji</b> · loš → <b>gori</b> · velik → <b>veći</b> · malen → <b>manji</b> · dug → <b>duži</b><br>Superlative: put <b>naj-</b> in front — <b>najbolji</b>, <b>najveći</b>, <b>najljepši</b>."},
    {h:"Sounding natural",

const Store = (()=>{
  const mem = {};
  let LS = null;
  try{ const t="__pl"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); LS = window.localStorage; }catch(e){ LS = null; }
  const CS = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function") ? window.storage : null;
  const mode = LS ? "local" : CS ? "claude" : "none";
  return {
    mode, persistent: mode!=="none",
    async get(k){
      if(LS){ try{ const v = LS.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} }
      if(CS){ try{ const r = await CS.get(k); if(r) return JSON.parse(r.value); }catch(e){} }
      return mem[k] ?? null;
    },
    async set(k,v){
      mem[k] = v;
      if(LS){ try{ LS.setItem(k, JSON.stringify(v)); return; }catch(e){} }
      if(CS){ try{ await CS.set(k, JSON.stringify(v)); }catch(e){} }
    },
    async del(k){
      delete mem[k];
      if(LS){ try{ LS.removeItem(k); }catch(e){} }
      if(CS){ try{ await CS.delete(k); }catch(e){} }
    }
  };
})();

async function loadState(){
  const saved = await Store.get("pleter:state");
  if(saved) S = Object.assign(S, saved);
  const today = new Date().toISOString().slice(0,10);
  if(S.lastDay !== today){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = (S.lastDay === y) ? (S.streak||0)+1 : 1;
    S.lastDay = today;
    await save();
  }
}
let PUSH_T = null;
async function save(){
  S.updatedAt = Date.now();
  await Store.set("pleter:state", S);
  paintStats();
  if(CLOUD.user){                       // debounced background push
    clearTimeout(PUSH_T);
    PUSH_T = setTimeout(()=>CLOUD.push(true), 4000);
  }
}
function addXP(n){ S.xp = (S.xp||0) + n; save(); }

function paintStats(){
  const total = UNITS.length*2;
  let d = 0;
  UNITS.forEach(u=>{ const x=S.done[u.id]; if(x){ if(x.read) d++; if(x.drill!=null) d++; } });
  $("#s-xp").textContent = S.xp||0;
  $("#s-streak").textContent = S.streak||0;
  $("#s-words").textContent = Object.keys(S.cards||{}).length;
  const pct = Math.min(1, d/total);
  ["#pl-a","#pl-b"].forEach(sel=>{
    const p = $(sel); if(!p) return;
    const L = p.getTotalLength();
    p.style.strokeDasharray = L;
    p.style.strokeDashoffset = L*(1-pct);
  });
  const lab = $("#pl-label");
  if(lab) lab.textContent = d===0 ? "Pleter se plete kako učiš."
        : d>=total ? "Pleter je gotov. Bravo!"
        : Math.round(pct*100) + "% programa gotovo";
}

function speak(text){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g," , "));
    u.lang = "hr-HR"; u.rate = .88;
    const v = VOICES.find(v=>/^hr/i.test(v.lang)) || VOICES.find(v=>/^(bs|sr|sl|pl|cs)/i.test(v.lang));

async function askClaude(system, messages){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: 1000, system, messages })
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return (data.content||[]).map(b => b.type === "text" ? b.text : "").join("\n").trim();
}

async function askGemini(system, messages, maxTokens, key, model){
  const body = {
    system_instruction: { parts:[{ text: system }] },
    contents: messages.map(m => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }]
    })),
    generationConfig: {
      maxOutputTokens: Math.max(2048, maxTokens || 2048),
      temperature: 0.85,
      thinkingConfig: { thinkingBudget: 0 }
    }
  };
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" +
              encodeURIComponent(model || GMODEL) + ":generateContent";
  const send = async payload => fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-goog-api-key": key || GKEY },
    body: JSON.stringify(payload)
  });

  let res = await send(body);
  if(res.status === 400){                       // some models reject thinkingConfig
    const b2 = JSON.parse(JSON.stringify(body));
    delete b2.generationConfig.thinkingConfig;
    res = await send(b2);
  }
  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
    if(res.status === 400 && /API key not valid/i.test(msg)) throw new Error("BADKEY");
    if(res.status === 403) throw new Error("BADKEY");
    if(res.status === 404) throw new Error("NOMODEL");
    if(res.status === 429) throw new Error("RATE");
    throw new Error("Gemini " + res.status + (msg ? ": " + msg : ""));
  }
  const d = await res.json();
  const c = (d.candidates || [])[0];
  const txt = (((c || {}).content || {}).parts || []).map(p => p.text || "").join("");
  if(!txt.trim()){
    const fr = c && c.finishReason;
    throw new Error(fr === "MAX_TOKENS" ? "Odgovor je predugačak — pokušaj ponovno."
                  : fr === "SAFETY"     ? "Gemini je blokirao odgovor."
                  : "Prazan odgovor od Geminija.");
  }
  return txt.trim();
}

const PROXY = "/.netlify/functions/chat";
let PROXY_OK = null;   // null = untested, true = live, false = not usable
let DIAG = null;       // what the health check actually found

async function probe(live){
  // Informational only. The health check tells us what's wrong when it can,
  // but an older function build has no ping endpoint — that's not a failure,
  // so we never rule the proxy out on anything except 404 or no response.
  try{
    const r = await fetch(PROXY + "?ping=1" + (live ? "&live=1" : ""));
    if(r.status === 404){
      DIAG = { deployed:false, key:false, origin:false, http:404 };
      PROXY_OK = false; paintGear(); return;
    }
    let j = null;
    try{ j = await r.json(); }catch(e){}
    if(j && j.ok === true && typeof j.keyConfigured === "boolean"){
      DIAG = { deployed:true, known:true, key:!!j.keyConfigured, origin:!!j.originAllowed,
               origins:j.originsConfigured || [], http:r.status,
               works: typeof j.keyWorks === "boolean" ? j.keyWorks : null,
               problem: j.keyProblem || "" };
    }else{
      // function is alive but predates ?ping — status unknown, so let the real call decide
      DIAG = { deployed:true, known:false, key:null, origin:null, http:r.status };
    }
  }catch(e){
    DIAG = { deployed:false, key:false, origin:false, http:0 };
    PROXY_OK = false;
  }
  paintGear();
}

async function askProxy(system, messages, maxTokens){
  let res;
  try{
    res = await fetch(PROXY, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ system, messages, maxTokens: maxTokens || 2048 })
    });
  }catch(e){ throw new Error("NOPROXY"); }          // offline, or opened as a local file

  if(res.status === 404){ throw new Error("NOPROXY:404"); }

  let data = null, raw = "";
  try{ raw = await res.text(); data = JSON.parse(raw); }
  catch(e){ throw new Error("BADRESP:" + res.status + ":" + raw.slice(0,120).replace(/\s+/g," ")); }

  if(!res.ok){
    if(res.status === 429) throw new Error(data.error || "RATE");
    if(res.status === 500) throw new Error("NOKEY");
    if(res.status === 403) throw new Error("ORIGIN");
    if(res.status === 405) throw new Error("OLDFN");
    throw new Error("HTTP " + res.status + " — " + (data.error || "no detail"));
  }
  if(!data || !data.text) throw new Error("Prazan odgovor.");
  PROXY_OK = true;
  return data.text.trim();
}

async function ask(system, messages, maxTokens){
  if(GKEY) return askGemini(system, messages, maxTokens);   // personal key wins, for local dev
  if(PROXY_OK !== false){
    try{ return await askProxy(system, messages, maxTokens); }
    catch(e){
      // Only fall through to Claude if nothing answered at all. If the function
      // replied with an error, surface that error — masking it hides the cause.
      if(String(e.message).indexOf("NOPROXY") === 0){ PROXY_OK = false; }
      else throw e;
    }
  }
  return askClaude(system, messages);
}
function parseJSON(txt){
  let t = String(txt).replace(/```json/gi,"").replace(/```/g,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  const c = t.indexOf("["), d = t.lastIndexOf("]");
  if(c > -1 && (c < a || a === -1)) t = t.slice(c, d+1); else if(a > -1) t = t.slice(a, b+1);
  return JSON.parse(t);
}
function apiError(e){
  const m = String((e && e.message) || "");
  if(/^KEY_INVALID/.test(m))  return `<div class="err"><b>Ključ nije valjan.</b> Google rejected the key itself. In Netlify, re-paste <code>GEMINI_API_KEY</code> — watch for a trailing space or a key you've since deleted in AI Studio — then <b>Trigger deploy</b>.</div>`;
  if(/^KEY_EXPIRED/.test(m))  return `<div class="err"><b>Ključ je istekao.</b> Make a fresh one in Google AI Studio, update the Netlify variable, and redeploy.</div>`;
  if(/^API_DISABLED/.test(m)) return `<div class="err"><b>API nije uključen.</b> The Generative Language API isn't enabled for this key's project. Enable it in Google Cloud, wait a minute, then try again.</div>`;
  if(/^PERMISSION/.test(m))   return `<div class="err"><b>Ključ nema dopuštenje.</b> The key exists but is restricted from calling this API. Check its API restrictions in Google Cloud.</div>`;
  if(/^BILLING/.test(m))      return `<div class="err"><b>Naplata nije uključena.</b> This Google project needs billing enabled.</div>`;
  if(/^QUOTA/.test(m))        return `<div class="err"><b>Kvota je potrošena.</b> The key's quota is used up. Wait, or check your limits in AI Studio.</div>`;
  if(/^MODEL/.test(m))        return `<div class="err"><b>Model nije dostupan.</b> This key can't reach <code>${esc(GMODEL)}</code>.</div>`;
  if(/^UPSTREAM_/.test(m))    return `<div class="err"><b>Gemini je odbio zahtjev.</b> The full reason is in Netlify → Logs → Functions → chat.<div style="font-family:var(--mono);font-size:11px;margin-top:8px;color:var(--stone-dim)">${esc(m)}</div></div>`;
  if(m === "ORIGIN") return `<div class="err"><b>Origin blokiran (403).</b> The function is running but rejected this site's address. In Netlify, either delete the <code>ALLOWED_ORIGIN</code> variable, or set it to exactly the URL in your address bar — including <code>https://</code> and no trailing slash. Redeploy after changing it.</div>`;
  if(m === "OLDFN") return `<div class="err"><b>Stara verzija funkcije (405).</b> The deployed <code>chat.js</code> is an older build that rejects this request shape. Replace <code>netlify/functions/chat.js</code> on GitHub with the latest one and commit.</div>`;
  if(m.indexOf("NOPROXY") === 0) return `<div class="err"><b>Funkcija nije pronađena (404).</b> Netlify has no function at <code>/.netlify/functions/chat</code>. Check the file is at exactly that path in your repo and that the deploy finished.</div>`;
  if(m.indexOf("BADRESP") === 0) return `<div class="err"><b>Neočekivan odgovor.</b> The server replied with something that isn't JSON — usually Netlify's own error page.<div style="font-family:var(--mono);font-size:11px;margin-top:8px;color:var(--stone-dim);word-break:break-all">${esc(m)}</div></div>`;
  if(m === "NOKEY") return `<div class="err"><b>Poslužitelj nije spreman.</b> The site is deployed but <code>GEMINI_API_KEY</code> isn't set. In Netlify: <b>Site configuration → Environment variables → Add a variable</b>, then redeploy — env vars only take effect on a new deploy.</div>`;
  if(m === "RATE" || /limit|Prebrzo|preopterećen|sutra/i.test(m)) return `<div class="err"><b>Uspori malo.</b> ${esc(m === "RATE" ? "Rate limit reached. Wait a minute." : m)}</div>`;
  if(m === "BADKEY")  return `<div class="err"><b>Ključ ne radi.</b> Google rejected that API key. Open <b>Postavke</b>, check you pasted the whole thing, and make sure the Generative Language API is enabled for the key.<div style="margin-top:9px"><button class="btn sm" onclick="openSettings()">Otvori postavke</button></div></div>`;
  if(m === "NOMODEL") return `<div class="err"><b>Model nije pronađen.</b> Your key doesn't have access to <b>${esc(GMODEL)}</b>. Pick a different one in <b>Postavke</b>.<div style="margin-top:9px"><button class="btn sm" onclick="openSettings()">Promijeni model</button></div></div>`;
  if(m === "RATE")    return `<div class="err"><b>Previše zahtjeva.</b> You've hit Gemini's rate limit. Wait a minute and try again — the free tier is generous but not unlimited.</div>`;
  if(!GKEY) return `<div class="err"><b>Nema veze s AI-jem.</b> Lessons, grammar, drills and flashcards all work without it.<div style="font-family:var(--mono);font-size:11px;margin-top:8px;color:var(--stone-dim);word-break:break-all">${esc(m) || "no error message"}</div><div style="margin-top:9px"><button class="btn sm" onclick="openSettings()">Otvori postavke</button></div></div>`;
  return `<div class="err"><b>Nije uspjelo.</b> ${esc(m) || "Unknown error."} Try again, or check your key in <b>Postavke</b>.</div>`;
}

let D = null;
function startDrill(id, custom){
  const u = UNITS.find(x=>x.id===id);
  D = { unit:id, title: custom ? "Provjera" : u.title, q: shuffle((custom||u.drills).slice()), i:0, score:0 };
  paintDrill();
}
function paintDrill(){
  if(D.i >= D.q.length){ return endDrill(); }
  const q = D.q[D.i];
  const bar = `<div class="progressline"><i style="width:${(D.i/D.q.length)*100}%"></i></div>`;
  const body = q.t === "mc"
    ? `<div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o)}</button>`).join("")}</div>`
    : `<input class="answer" id="ans" placeholder="Napiši na hrvatskom…" autocomplete="off" autocapitalize="off" spellcheck="false">
       <div style="margin-top:12px"><button class="btn" onclick="pick(-1)">Provjeri</button></div>`;
  shell(`pitanje ${D.i+1} od ${D.q.length}`, esc(D.title), "",
    `${bar}<div class="card"><div class="q">${esc(q.q)}</div>${body}<div id="verdict"></div></div>`);
  const a = $("#ans");
  if(a){ a.focus(); a.addEventListener("keydown", e=>{ if(e.key==="Enter") pick(-1); }); }
}
function pick(i){
  const q = D.q[D.i];
  let ok;
  if(q.t === "mc"){
    ok = i === q.a;
    $$(".opt").forEach((b,j)=>{ b.disabled = true; if(j===q.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  } else {
    const v = norm($("#ans").value);
    if(!v) return;
    ok = q.a.some(x => norm(x) === v);
    $("#ans").disabled = true;
    $("#ans").style.borderColor = ok ? "var(--olive)" : "var(--madder)";
  }
  if(ok){ D.score++; addXP(5); }
  $("#verdict").innerHTML = `<div class="verdict ${ok?"ok":"no"}">
    <b style="color:${ok?"var(--olive)":"var(--madder)"}">${ok?"Točno!":"Nije točno."}</b> ${esc(q.e||"")}
    </div><div style="margin-top:12px"><button class="btn" id="nx">${D.i+1>=D.q.length?"Rezultat":"Dalje →"}</button></div>`;
  $("#nx").focus();
  $("#nx").onclick = ()=>{ D.i++; paintDrill(); };
}
function endDrill(){
  const pct = Math.round(D.score/D.q.length*100);
  const msg = pct===100 ? "Savršeno. Sve točno." : pct>=75 ? "Vrlo dobro." : pct>=50 ? "Dobar početak — ponovi lekciju." : "Vrati se na lekciju pa probaj opet.";
  if(D.unit){ S.done[D.unit] = S.done[D.unit]||{}; S.done[D.unit].drill = Math.max(S.done[D.unit].drill||0, pct); save(); }
  const next = D.unit ? UNITS.find(x=>x.id===D.unit+1) : null;
  shell("gotovo · done", "Rezultat", "",
    `<div class="card" style="text-align:center;padding:40px">
      <div style="font-family:var(--mono);font-size:56px;color:var(--brass);line-height:1">${D.score}<span style="font-size:26px;color:var(--stone-dim)">/${D.q.length}</span></div>
      <p style="font-family:var(--display);font-size:22px;margin-top:8px">${msg}</p>
      <div class="chips" style="justify-content:center;margin-top:16px">
        ${D.unit?`<button class="btn ghost sm" onclick="startDrill(${D.unit})">Opet</button>
        <button class="btn ghost sm" onclick="go('unit',${D.unit})">Natrag na lekciju</button>`:""}
        ${next?`<button class="btn sm" onclick="go('unit',${next.id})">Sljedeća cjelina →</button>`:`<button class="btn sm" onclick="go('razgovor')">Idi na razgovor →</button>`}
      </div></div>`);
}
